        showToast("当前存款总数必填");
        return;
      }
      if (isSaved && !els.computedProfit.value.trim()) {
        showToast("本月收益必填");
        return;
      }
      if (isSaved && !els.category.value) {
        showToast("存款位置必填");
        return;
      }
      if (isSaved && currentValue < 0) {
        showToast("当前存款总数不能小于 0");
        return;
      }
      const savedDraft = isSaved ? draftSavedEntry() : null;
      const payload = {
        id: state.editingId || crypto.randomUUID(),
        type: state.entryType,
        schemaVersion: 2,
        amount: isSaved ? savedDraft.amount : roundMoney(amount),
        currentValue: isSaved ? roundMoney(currentValue) : 0,
        periodProfit: isSaved ? savedDraft.periodProfit : 0,
        date: els.date.value,
        category: els.category.value,
        owner: isSaved ? "" : els.owner.value,
        account: "",
        note: els.note.value.trim(),
        createdAt: existing?.createdAt || Date.now(),
        updatedAt: Date.now()
      };
      const index = state.entries.findIndex(item => item.id === payload.id);
      if (index >= 0) state.entries[index] = payload;
      else state.entries.push(payload);
      recalculateSavedProfits();
      save();
      resetForm(payload.type);
      render();
      showToast(index >= 0 ? "已更新" : "已保存");
    }

    function editEntry(id) {
      const item = state.entries.find(entry => entry.id === id);
      if (!item) return;
      const detailBeforeEdit = state.detail;
      state.editingId = id;
      setEntryType(item.type);
      state.detail = detailBeforeEdit;
      els.amount.value = item.type === "saved" ? savedAmount(item) : item.amount;
      els.date.value = item.date;
      els.category.value = item.category;
      els.owner.value = item.type === "income" && incomeOwners.includes(item.owner) ? item.owner : incomeOwners[0];
      els.currentValue.value = item.type === "saved" ? savedCurrentValue(item) : "";
      els.computedProfit.value = item.type === "saved" ? savedProfit(item) : "";
      els.note.value = item.note || "";
      els.formTitle.textContent = "编辑记录";
      els.saveBtn.textContent = "保存修改";
      els.cancelEdit.textContent = "取消编辑";
      els.cancelEdit.hidden = false;
      updateComputedProfitPreview();
      updateDateChip();
      renderPickerTriggers();
      setEntryDropdown(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteEntry(id) {
      if (!confirm("确定删除这条记录吗？")) return;
      state.entries = state.entries.filter(item => item.id !== id);
      recalculateSavedProfits();
      save();
      render();
      showToast("已删除");
    }

    function handleListAction(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      if (button.dataset.action === "edit") editEntry(button.dataset.id);
      if (button.dataset.action === "delete") deleteEntry(button.dataset.id);
    }

    function openCalendarDetail(button) {
      const year = Number(button.dataset.year);
      const month = Number(button.dataset.month) || null;
      if (!year) return;
      const isEntryCalendar = button.dataset.scope === "entry";
      const entryType = button.dataset.type || state.entryType;
      const type = month ? "all" : (isEntryCalendar ? entryType : "all");
      const activeView = document.querySelector(".view.active")?.id || "viewOverview";
      const sourceView = document.querySelector(`[data-view="${activeView}"]`) ? activeView : "viewOverview";
      const sourceTab = document.querySelector(`[data-view="${sourceView}"]`);
      state.detail = { year, month, type, sourceView };
      switchView("viewDetail", sourceTab);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    const excelColumns = [
      "类型",
      "日期",
      "金额/本月存入",
      "本月收益",
      "当前存款总数",
      "分类/存款位置",
      "收入人",
      "备注"
    ];

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, "\"\"")}"`;
    }

    function csvText(rows) {
      const lines = [
        excelColumns.map(csvCell).join(","),
        ...rows.map(row => excelColumns.map(column => csvCell(row[column])).join(","))
      ];
      return `\ufeff${lines.join("\r\n")}`;
    }

    function downloadExcel(filename, rows) {
      const blob = new Blob([csvText(rows)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function entryToExcelRow(item) {
      return {
        "类型": item.type === "income" ? "收入" : "存入",
        "日期": item.date || "",
        "金额/本月存入": item.type === "saved" ? savedAmount(item) : item.amount,

        "当前存款总数": item.type === "saved" ? savedCurrentValue(item) : "",

    function parseCsv(text) {
      const clean = String(text || "").replace(/^\ufeff/, "");
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let index = 0; index < clean.length; index += 1) {
        const char = clean[index];
        const next = clean[index + 1];
        if (quoted) {
          if (char === "\"" && next === "\"") {
            cell += "\"";
            index += 1;
          } else if (char === "\"") {
            quoted = false;
          } else {
            cell += char;
          }
          continue;
        }
        if (char === "\"") {
          quoted = true;
        } else if (char === ",") {
          row.push(cell.trim());
          cell = "";
        } else if (char === "\n") {
          row.push(cell.trim());
          rows.push(row);
          row = [];
          cell = "";
        } else if (char !== "\r") {
          cell += char;
        }
      }
      row.push(cell.trim());
      rows.push(row);
      return rows.filter(item => item.some(value => value));
    }

    function parseExcelRows(text) {
      const rows = parseCsv(text);
      if (rows.length < 2) return [];
      const headers = rows[0];
      return rows.slice(1).map(row => headers.reduce((result, header, index) => {
        result[header] = row[index] || "";
        return result;
      }, {}));
    }

    function importExcel(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const rows = parseExcelRows(String(reader.result || ""));
        const imported = rows.map(row => {
          const type = row["类型"] === "存入" ? "saved" : row["类型"] === "收入" ? "income" : "";
          if (!type) return null;
          const amount = roundMoney(parseNumber(row["金额/本月存入"]));
          const periodProfit = roundMoney(parseNumber(row["本月收益"] || row["月收益"] || row["收益"]));
          const currentValueText = (row["当前存款总数"] || "").trim();
          const currentValue = roundMoney(parseNumber(currentValueText));
          const date = (row["日期"] || "").trim();
          const category = (row["分类/存款位置"] || "").trim();
          const owner = (row["收入人"] || "").trim();
          const note = (row["备注"] || "").trim();
          if (type === "income" && (!date || amount <= 0 || !category || !owner)) return null;
          if (type === "saved" && (!category || !currentValueText || currentValue < 0)) return null;
          if (type === "income") ensureSettingValue("owner", owner);
          if (type === "income") ensureSettingValue("category", category);
          if (type === "saved") ensureSettingValue("saved", category);
          return normalizeEntry({
            id: crypto.randomUUID(),
            type,
            schemaVersion: 2,
            amount: type === "saved" ? amount : amount,
            currentValue: type === "saved" ? currentValue : 0,
            periodProfit: type === "saved" ? periodProfit : 0,
            date,
            category,
            owner: type === "income" ? owner : "",
            note,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        }).filter(Boolean);
        if (!imported.length) {
          showToast("没有可导入的数据");
          return;
        }
        state.entries.push(...imported);
        recalculateSavedProfits();
        saveSettings();
        save();
        render();
        showToast(`已导入 ${imported.length} 条`);
      };
      reader.readAsText(file);
    }

          state.weightMonth = 12;
