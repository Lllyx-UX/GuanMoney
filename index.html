          ...defaultCategories,
          income: uniqueList(settings.incomeCategories, defaultCategories.income),
          saved: uniqueList(settings.savedPlaces, defaultCategories.saved)
        };
      } catch {
        incomeOwners = [...defaultIncomeOwners];
        categories = JSON.parse(JSON.stringify(defaultCategories));
      }
    }

    function ensureSettingValue(kind, value) {
      const name = String(value || "").trim();
      if (!name) return;
      const list = settingList(kind);
      if (!list.includes(name)) list.push(name);
    }

    function savedAmount(item) {
      return Number.isFinite(Number(item.amount)) ? Number(item.amount) : 0;
    }

    function savedCurrentValue(item) {
      return Number.isFinite(Number(item.currentValue)) ? Number(item.currentValue) : savedAmount(item);
    }

    function compareSavedOrder(a, b) {
      return (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0);
    }

    function savedSnapshots() {
      return state.entries
        .filter(item => item.type === "saved")
        .sort(compareSavedOrder);
    }

    function previousSavedSnapshot(item) {
      const snapshots = savedSnapshots().filter(snapshot => snapshot.id !== item.id);
      const nextIndex = snapshots.findIndex(snapshot => compareSavedOrder(item, snapshot) < 0);
      return nextIndex === -1 ? snapshots[snapshots.length - 1] : snapshots[nextIndex - 1];
    }

    function storedSavedProfit(item) {
      if (item.type !== "saved") return 0;
      return Number.isFinite(Number(item.periodProfit)) ? Number(item.periodProfit) : 0;
    }

    function savedProfit(item) {
      return roundMoney(storedSavedProfit(item));
    }

    function calculatedSavedAmount(item) {
      if (item.type !== "saved") return 0;
      const previous = previousSavedSnapshot(item);
      const previousValue = previous ? savedCurrentValue(previous) : 0;
      return roundMoney(savedCurrentValue(item) - previousValue - savedProfit(item));
    }

    function recalculateSavedProfits() {
      savedSnapshots().forEach(item => {
        item.periodProfit = savedProfit(item);
        item.amount = calculatedSavedAmount(item);
      });
    }

    function normalizeEntry(item) {
      const type = item.type === "saved" ? "saved" : "income";
      const rawAmount = Number(item.amount) || 0;
      const fallbackDate = toDateInput(new Date(item.createdAt || Date.now()));
      if (type === "saved") {
        const rawSaved = item.savedAmount ?? item.depositAmount ?? item.monthlySaved ?? item.netSaved ?? item.amount;
        const rawCurrent = item.currentValue ?? item.currentAmount ?? item.marketValue ?? item.amount;
        const currentValue = Number.isFinite(Number(rawCurrent)) ? Number(rawCurrent) : rawAmount;
        const rawProfit = item.periodProfit ?? item.monthlyProfit ?? item.profit;
        const legacyProfit = Number.isFinite(Number(item.yieldAmount))
          ? Number(item.yieldAmount)
          : (Number.isFinite(Number(rawCurrent)) ? Number(rawCurrent) - rawAmount : 0);
        const savedDate = item.date || item.depositDate || fallbackDate;
        return {
          id: item.id || crypto.randomUUID(),
          type,
          schemaVersion: Number(item.schemaVersion) || 1,
          amount: roundMoney(Number.isFinite(Number(rawSaved)) ? Number(rawSaved) : rawAmount),
          currentValue: roundMoney(currentValue),
          periodProfit: Number.isFinite(Number(rawProfit)) ? Number(rawProfit) : legacyProfit,
          date: savedDate,
          category: item.category || categories.saved[0] || "微众银行",
          account: "",
          note: item.note || "",
          createdAt: item.createdAt || Date.now(),
          updatedAt: item.updatedAt || Date.now()
        };
      }
      return {
        id: item.id || crypto.randomUUID(),
        type,
        schemaVersion: Number(item.schemaVersion) || 1,
        amount: roundMoney(rawAmount),
        currentValue: 0,
        periodProfit: 0,
        date: item.date || item.depositDate || fallbackDate,
        category: item.category || "工资",
        owner: item.owner || "",
        account: "",
        note: item.note || "",
        createdAt: item.createdAt || Date.now(),
        updatedAt: item.updatedAt || Date.now()
      };
    }

    function normalizeEntries(rows) {
      const normalized = rows.map(normalizeEntry);
      const rawById = new Map(normalized.map((item, index) => [item.id, rows[index] || {}]));
      const snapshots = normalized.filter(item => item.type === "saved").sort(compareSavedOrder);
      snapshots.forEach((item, index) => {
        const raw = rawById.get(item.id) || {};
        const hasNewSavedAmount = Number(raw.schemaVersion) >= 2
          || raw.savedAmount !== undefined
          || raw.depositAmount !== undefined
          || raw.monthlySaved !== undefined
          || raw.netSaved !== undefined;
        const lookedLikeOldSnapshot = !hasNewSavedAmount && (
          raw.currentValue !== undefined
          || raw.currentAmount !== undefined
          || raw.marketValue !== undefined
          || raw.periodProfit !== undefined
          || raw.monthlyProfit !== undefined
          || raw.profit !== undefined
        );
        if (lookedLikeOldSnapshot) {
          const previous = snapshots[index - 1];
          const rawProfit = Number(raw.periodProfit ?? raw.monthlyProfit ?? raw.profit ?? 0);
          item.amount = previous ? roundMoney(savedCurrentValue(item) - savedCurrentValue(previous) - rawProfit) : 0;
        }
      });
      return normalized;
    }

    function normalizeWeightEntry(item) {
      return {
        id: item.id || crypto.randomUUID(),
        person: item.person || incomeOwners[0] || defaultIncomeOwners[0],
        date: item.date || toDateInput(new Date(item.createdAt || Date.now())),
        weight: roundMoney(Number(item.weight) || 0),
        note: item.note || "",
        createdAt: item.createdAt || Date.now(),
        updatedAt: item.updatedAt || Date.now()
      };
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries));
      localStorage.setItem(WEIGHT_STORAGE_KEY, JSON.stringify(state.weightEntries));
      localStorage.setItem(CHECKIN_STORAGE_KEY, JSON.stringify(state.checkins));
    }

    function load() {
      loadSettings();
      try {
        state.entries = normalizeEntries(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
      } catch {
        state.entries = [];
      }
      try {
        state.weightEntries = JSON.parse(localStorage.getItem(WEIGHT_STORAGE_KEY) || "[]")
          .map(normalizeWeightEntry)
          .filter(item => item.weight > 0);
      } catch {
        state.weightEntries = [];
      }
      try {
        const storedCheckins = JSON.parse(localStorage.getItem(CHECKIN_STORAGE_KEY) || "[]");
        state.checkins = Array.isArray(storedCheckins) ? storedCheckins.filter(item => item && item.id && item.title).map(item => ({
          id: item.id,
          title: String(item.title),
          emoji: item.emoji || "✓",
          color: item.color || "#009bff",
          records: item.records && typeof item.records === "object" ? item.records : {}
        })) : [];
      } catch {
        state.checkins = [];
      }
      state.checkins.forEach(item => {
        if (item.title === "运动") item.color = CHECKIN_COLORS[5];
        if (item.title === "阅读") item.color = CHECKIN_COLORS[10];
      });
      if (!localStorage.getItem(CHECKIN_STORAGE_KEY)) {
        state.checkins = [
          { id: crypto.randomUUID(), title: "早起", emoji: "☀", color: CHECKIN_COLORS[8], records: {} },
          { id: crypto.randomUUID(), title: "运动", emoji: "⌁", color: CHECKIN_COLORS[5], records: {} },
          { id: crypto.randomUUID(), title: "阅读", emoji: "▤", color: CHECKIN_COLORS[10], records: {} }
        ];
      }
      if (!state.entries.length) {
        try {
          const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");
          if (Array.isArray(legacy) && legacy.length) {
            state.entries = normalizeEntries(legacy.map(item => ({
              ...item,
              type: "saved",
              date: item.depositDate
            })));
            recalculateSavedProfits();
            save();
          }
        } catch {
          state.entries = [];
        }
      }
      state.entries.forEach(item => {
        if (item.type === "income") ensureSettingValue("owner", item.owner);
        if (item.type === "income") ensureSettingValue("category", item.category);
        if (item.type === "saved") ensureSettingValue("saved", item.category);
      });
      saveSettings();
      recalculateSavedProfits();
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function entriesForYear(year) {
      return state.entries.filter(item => Number((item.date || "").slice(0, 4)) === year);
    }

    function totals(entries) {
      const incomeEntries = entries.filter(item => item.type === "income");
      const savedEntries = entries.filter(item => item.type === "saved");
      const income = incomeEntries.reduce((sum, item) => sum + item.amount, 0);
      const incomeByOwner = incomeOwners.reduce((result, owner) => {
        result[owner] = incomeEntries
          .filter(item => item.owner === owner)
          .reduce((sum, item) => sum + item.amount, 0);
        return result;
      }, {});
      const incomeOwnerCounts = incomeOwners.reduce((result, owner) => {
        result[owner] = incomeEntries.filter(item => item.owner === owner).length;
        return result;
      }, {});
      const saved = savedEntries.reduce((sum, item) => sum + savedAmount(item), 0);
      const profit = savedEntries.reduce((sum, item) => sum + savedProfit(item), 0);
      return {
        income,
        incomeByOwner,
        incomeOwnerCounts,
        saved,
        profit,
        spend: income - saved,
        hasIncome: incomeEntries.length > 0,
        hasSaved: savedEntries.length > 0,
        hasProfit: savedEntries.length > 0
      };
    }

    function dataText(value, hasData) {
      return hasData ? money(value) : "--";
    }

    function dataTextInDetail(value, hasData) {
      return hasData ? moneyInDetail(value) : "--";
    }

    function spendText(summary) {
      return summary.hasIncome ? money(summary.spend) : "--";
    }

    function spendTextInDetail(summary) {
      return summary.hasIncome ? moneyInDetail(summary.spend) : "--";
    }

    function spendClass(summary) {
      if (!summary.hasIncome) return "muted-color";
      return summary.spend < 0 ? "loss-color" : "neutral-color";
    }

    function profitClass(value) {
      return value < 0 ? "loss-color" : value > 0 ? "spend-color" : "muted-color";
    }

    function assetTotals() {
      const snapshots = savedSnapshots();
      const latest = snapshots[snapshots.length - 1];
      const current = latest ? savedCurrentValue(latest) : 0;
      const profit = snapshots.reduce((sum, item) => sum + savedProfit(item), 0);
      return { current, profit, hasData: snapshots.length > 0 };
    }

    function renderSummary() {
      const assets = assetTotals();
      els.assetTotal.textContent = dataText(assets.current, assets.hasData);
      els.assetTotal.className = assets.hasData ? "saved-color" : "muted-color";
    }

    function renderMonthGrid() {
      state.viewYear = clampVisibleYear(state.viewYear);
      const yearTotals = totals(entriesForYear(state.viewYear));
      const rows = Array.from({ length: maxVisibleMonth(state.viewYear) }, (_, index) => {
        const month = index + 1;
        const monthlyEntries = state.entries.filter(item => {
          const year = Number((item.date || "").slice(0, 4));
          const itemMonth = Number((item.date || "").slice(5, 7));
          return year === state.viewYear && itemMonth === month;
        });
        return {
          label: `${month}月`,
          year: state.viewYear,
          month,
          isCurrentMonth: state.viewYear === currentYear() && month === currentMonth(),
          ...totals(monthlyEntries)
        };
      });
      els.yearLabel.textContent = `${state.viewYear}`;
      renderPeriodSummary(yearTotals, "本年");
      renderPeriodCells(rows);
    }

    function renderYearGrid() {
      state.viewYear = clampVisibleYear(state.viewYear);
      const offset = Math.max(0, state.viewYear - MIN_YEAR);
      const startYear = MIN_YEAR + Math.floor(offset / 12) * 12;
      const historyTotals = totals(state.entries.filter(item => Number((item.date || "").slice(0, 4)) >= MIN_YEAR));
      const yearCount = Math.max(1, currentYear() - startYear + 1);
      const rows = Array.from({ length: Math.min(12, yearCount) }, (_, index) => {
        const year = startYear + index;
        return { label: `${year}年`, year, ...totals(entriesForYear(year)) };
      });
      const endYear = startYear + rows.length - 1;
      els.yearLabel.textContent = startYear === endYear ? `${startYear}` : `${startYear}-${endYear}`;
      renderPeriodSummary(historyTotals, "历史");
      renderPeriodCells(rows);
    }

    function renderPeriodSummary(summary, label) {
      const hideHistory = state.periodMode === "year";
      els.periodIncomeLabel.closest(".period-summary").hidden = hideHistory;
      if (hideHistory) return;
      els.periodIncomeLabel.closest(".period-summary").hidden = false;
      const prefix = state.periodMode === "month" ? "" : label;
      els.periodIncomeLabel.textContent = `${prefix}收入`;
      els.periodSavedLabel.textContent = `${prefix}存入 / ${prefix}花销`;
      els.periodProfitLabel.textContent = `${prefix}收益`;
      els.periodSpendLabel.textContent = `${prefix}花销`;
      els.periodIncome.textContent = dataText(summary.income, summary.hasIncome);
      els.periodIncome.className = summary.hasIncome ? "income-color" : "muted-color";
      els.periodSaved.textContent = dataText(summary.saved, summary.hasSaved);
      els.periodSaved.className = !summary.hasSaved ? "muted-color" : summary.saved < 0 ? "loss-color" : "saved-color";
      els.periodProfit.textContent = dataText(summary.profit, summary.hasProfit);
      els.periodProfit.className = summary.hasProfit ? profitClass(summary.profit) : "muted-color";
      els.periodSpend.textContent = spendText(summary);
      els.periodSpend.className = spendClass(summary);
      renderPeriodAllocation(summary);
    }

    function allocationShare(summary) {
      const savedValue = summary.hasSaved ? Math.max(summary.saved, 0) : 0;
      const spendValue = summary.hasIncome ? Math.max(summary.spend, 0) : 0;
      const total = savedValue + spendValue;
      if (total <= 0) {
        return { hasData: false, savedPercent: 0, spendPercent: 0 };
      }
      const savedPercent = Math.round((savedValue / total) * 100);
      return { hasData: true, savedPercent, spendPercent: 100 - savedPercent };
    }

    function renderPeriodAllocation(summary) {
      const share = allocationShare(summary);
      els.periodAllocationChart.classList.toggle("is-empty", !share.hasData);
      els.periodAllocationChart.style.setProperty("--saved-share", `${share.savedPercent}%`);
      els.periodAllocationChart.style.setProperty("--spend-share", share.hasData ? `${share.spendPercent}%` : "50%");
      els.periodSavedShareLabel.textContent = share.hasData ? `年存入 ${share.savedPercent}%` : "年存入 --";
      els.periodSpendShareLabel.textContent = share.hasData ? `年花销 ${share.spendPercent}%` : "年花销 --";
      els.periodSavedShareAmount.textContent = dataTextInDetail(summary.saved, summary.hasSaved);
      els.periodSavedShareAmount.className = !summary.hasSaved ? "muted-color" : summary.saved < 0 ? "loss-color" : "saved-color";
      els.periodSpendShareAmount.textContent = spendTextInDetail(summary);
      els.periodSpendShareAmount.className = spendClass(summary);
    }

    function renderPeriodCells(rows) {
      els.periodGrid.innerHTML = rows.map(row => {
        const empty = !row.hasIncome && !row.hasSaved && !row.hasProfit;
        return `
          <button class="period-cell ${empty ? "is-empty" : ""} ${row.isCurrentMonth ? "is-current-month" : ""}" type="button" data-scope="overview" data-year="${row.year}" data-month="${row.month || ""}" data-label="${escapeHtml(row.label)}">
            <div class="label">${row.label}</div>
            <div class="mini-row"><span>收入</span><strong class="${row.hasIncome ? "income-color" : "muted-color"}">${dataTextInDetail(row.income, row.hasIncome)}</strong></div>
            <div class="mini-row"><span>存入</span><strong class="${!row.hasSaved ? "muted-color" : row.saved < 0 ? "loss-color" : "saved-color"}">${dataTextInDetail(row.saved, row.hasSaved)}</strong></div>
            <div class="mini-row"><span>收益</span><strong class="${row.hasProfit ? profitClass(row.profit) : "muted-color"}">${dataTextInDetail(row.profit, row.hasProfit)}</strong></div>
            <div class="mini-row"><span>花销</span><strong class="${spendClass(row)}">${spendTextInDetail(row)}</strong></div>
          </button>
        `;
      }).join("");
    }

    function renderPeriodGrid() {
      document.querySelectorAll("[data-period-mode]").forEach(button => {
        button.classList.toggle("active", button.dataset.periodMode === state.periodMode);
      });
      if (state.periodMode === "year") renderYearGrid();
      else renderMonthGrid();
    }

    function renderEntryPeriodSummary(summary, label) {
      const hideIncomeHistory = state.entryType === "income" && state.entryPeriodMode === "year";
      els.entryPeriodSummary.hidden = hideIncomeHistory;
      if (hideIncomeHistory) {
        els.entryPeriodSummary.innerHTML = "";
        return;
      }
      if (state.entryType === "saved") {
        const isYearMode = state.entryPeriodMode === "year";
        const savedLabel = isYearMode ? "存款总额" : `${label}存入`;
        const savedValue = isYearMode ? assetTotals().current : summary.saved;
        const hasSavedValue = isYearMode ? savedSnapshots().length > 0 : summary.hasSaved;
        const profitLabel = isYearMode ? "总盈亏" : `${label}收益`;
        const profitValue = isYearMode ? assetTotals().profit : summary.profit;
        const hasProfitValue = isYearMode ? assetTotals().hasData : summary.hasProfit;
        els.entryPeriodSummary.innerHTML = `
          <div class="metric">
            <span>${savedLabel}</span>
            <strong class="${hasSavedValue ? "saved-color" : "muted-color"}">${dataText(savedValue, hasSavedValue)}</strong>
          </div>
          <div class="metric">
            <span>${profitLabel}</span>
            <strong class="${hasProfitValue ? profitClass(profitValue) : "muted-color"}">${dataText(profitValue, hasProfitValue)}</strong>
          </div>
        `;
        return;
      }
      const incomePrefix = state.entryPeriodMode === "month" ? "" : label;
      els.entryPeriodSummary.innerHTML = `
        <div class="metric">
          <span>${incomePrefix}收入</span>
          <strong class="${summary.hasIncome ? "income-color" : "muted-color"}">${dataText(summary.income, summary.hasIncome)}</strong>
        </div>
        <div class="metric">
          <span>${incomePrefix}陈</span>
          <strong class="${summary.incomeOwnerCounts["陈"] ? "income-color" : "muted-color"}">${dataText(summary.incomeByOwner["陈"], summary.incomeOwnerCounts["陈"])}</strong>
        </div>
        <div class="metric">
          <span>${incomePrefix}梁</span>
          <strong class="${summary.incomeOwnerCounts["梁"] ? "income-color" : "muted-color"}">${dataText(summary.incomeByOwner["梁"], summary.incomeOwnerCounts["梁"])}</strong>
        </div>
      `;
    }

    function renderEntryPeriodCells(rows) {
      const isSaved = state.entryType === "saved";
      els.entryPeriodGrid.innerHTML = rows.map(row => {
        const empty = isSaved ? !row.hasSaved && !row.hasProfit : !row.hasIncome;
        const detail = isSaved
          ? `
            <div class="mini-row"><span>存入</span><strong class="${!row.hasSaved ? "muted-color" : row.saved < 0 ? "loss-color" : "saved-color"}">${dataTextInDetail(row.saved, row.hasSaved)}</strong></div>
            <div class="mini-row"><span>收益</span><strong class="${row.hasProfit ? profitClass(row.profit) : "muted-color"}">${dataTextInDetail(row.profit, row.hasProfit)}</strong></div>
          `
          : `
            <div class="mini-row"><span>陈</span><strong class="${row.incomeOwnerCounts["陈"] ? "income-color" : "muted-color"}">${dataTextInDetail(row.incomeByOwner["陈"], row.incomeOwnerCounts["陈"])}</strong></div>
            <div class="mini-row"><span>梁</span><strong class="${row.incomeOwnerCounts["梁"] ? "income-color" : "muted-color"}">${dataTextInDetail(row.incomeByOwner["梁"], row.incomeOwnerCounts["梁"])}</strong></div>
          `;
        return `
          <button class="period-cell ${empty ? "is-empty" : ""} ${row.isCurrentMonth ? "is-current-month" : ""}" type="button" data-scope="entry" data-type="${state.entryType}" data-year="${row.year}" data-month="${row.month || ""}" data-label="${escapeHtml(row.label)}">
            ${isSaved
              ? `<div class="label">${row.label}</div>`
              : `<div class="income-cell-head"><div class="label">${row.label}</div><strong class="${row.hasIncome ? "" : "muted-color"}">${dataTextInDetail(row.income, row.hasIncome)}</strong></div>`}
            ${detail}
          </button>
        `;
      }).join("");
    }

    function renderEntryMonthGrid() {
      state.entryViewYear = clampVisibleYear(state.entryViewYear);
      const scopedEntries = state.entries.filter(item => item.type === state.entryType);
      const yearTotals = totals(scopedEntries.filter(item => Number((item.date || "").slice(0, 4)) === state.entryViewYear));
      const rows = Array.from({ length: maxVisibleMonth(state.entryViewYear) }, (_, index) => {
        const month = index + 1;
        const monthlyEntries = scopedEntries.filter(item => {
          const year = Number((item.date || "").slice(0, 4));
          const itemMonth = Number((item.date || "").slice(5, 7));
          return year === state.entryViewYear && itemMonth === month;
        });
        return {
          label: `${month}月`,
          year: state.entryViewYear,
          month,
          isCurrentMonth: state.entryViewYear === currentYear() && month === currentMonth(),
          ...totals(monthlyEntries)
        };
      });
      els.entryYearLabel.textContent = `${state.entryViewYear}`;
      renderEntryPeriodSummary(yearTotals, "本年");
      renderEntryPeriodCells(rows);
    }

    function renderEntryYearGrid() {
      state.entryViewYear = clampVisibleYear(state.entryViewYear);
      const offset = Math.max(0, state.entryViewYear - MIN_YEAR);
      const startYear = MIN_YEAR + Math.floor(offset / 12) * 12;
      const scopedEntries = state.entries.filter(item => item.type === state.entryType);
      const historyTotals = totals(scopedEntries.filter(item => Number((item.date || "").slice(0, 4)) >= MIN_YEAR));
      const yearCount = Math.max(1, currentYear() - startYear + 1);
      const rows = Array.from({ length: Math.min(12, yearCount) }, (_, index) => {
        const year = startYear + index;
        return {
          label: `${year}年`,
          year,
          ...totals(scopedEntries.filter(item => Number((item.date || "").slice(0, 4)) === year))
        };
      });
      const endYear = startYear + rows.length - 1;
      els.entryYearLabel.textContent = startYear === endYear ? `${startYear}` : `${startYear}-${endYear}`;
      renderEntryPeriodSummary(historyTotals, "历史");
      renderEntryPeriodCells(rows);
    }

    function renderEntryPeriodGrid() {
      document.querySelectorAll("[data-entry-period-mode]").forEach(button => {
        button.classList.toggle("active", button.dataset.entryPeriodMode === state.entryPeriodMode);
      });
      if (state.entryPeriodMode === "year") renderEntryYearGrid();
      else renderEntryMonthGrid();
    }

    function entriesForDetail(detail) {
      if (!detail) return [];
      return state.entries.filter(item => {
        if (detail.type !== "all" && item.type !== detail.type) return false;
        const year = Number((item.date || "").slice(0, 4));
        const month = Number((item.date || "").slice(5, 7));
        if (year !== detail.year) return false;
        return detail.month ? month === detail.month : true;
      });
    }

    function periodEntriesForDetail(detail) {
      if (!detail) return [];
      return state.entries.filter(item => {
        const year = Number((item.date || "").slice(0, 4));
        const month = Number((item.date || "").slice(5, 7));
        if (year !== detail.year) return false;
        return detail.month ? month === detail.month : true;
      });
    }

    function currentSavedValueForDetail(detail) {
      const snapshots = periodEntriesForDetail(detail)
        .filter(item => item.type === "saved")
        .sort((a, b) => {
          const dateCompare = (b.date || "").localeCompare(a.date || "");
          if (dateCompare) return dateCompare;
          return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
        });
      if (!snapshots.length) return { hasData: false, value: 0 };
      return { hasData: true, value: savedCurrentValue(snapshots[0]) };
    }

    function renderDetailSummary(detail) {
      const entries = periodEntriesForDetail(detail);
      const summary = totals(entries);
      const currentSaved = currentSavedValueForDetail(detail);
      const ownerRows = incomeOwners.map(owner => `
        <div class="detail-owner-row">
          <span>${escapeHtml(owner)}</span>
          <strong class="${summary.incomeOwnerCounts[owner] ? "income-color" : "muted-color"}">${dataTextInDetail(summary.incomeByOwner[owner], summary.incomeOwnerCounts[owner])}</strong>
        </div>
      `).join("");
      const savedTotalLabel = detail.month ? "当月存款总数" : "当年存款总数";
      els.detailSummary.innerHTML = `
        <div class="detail-summary-grid">
          <div class="detail-summary-card">
            <span>收入总数</span>
            <strong class="${summary.hasIncome ? "income-color" : "muted-color"}">${dataTextInDetail(summary.income, summary.hasIncome)}</strong>
          </div>
          <div class="detail-summary-card">
            <span>${savedTotalLabel}</span>
            <strong class="${currentSaved.hasData ? "saved-color" : "muted-color"}">${dataTextInDetail(currentSaved.value, currentSaved.hasData)}</strong>
          </div>
          <div class="detail-summary-card">
            <span>存入</span>
            <strong class="${summary.hasSaved ? "saved-color" : "muted-color"}">${dataTextInDetail(summary.saved, summary.hasSaved)}</strong>
          </div>
          <div class="detail-summary-card">
            <span>收益</span>
            <strong class="${summary.hasProfit ? profitClass(summary.profit) : "muted-color"}">${dataTextInDetail(summary.profit, summary.hasProfit)}</strong>
          </div>
          <div class="detail-summary-card">
            <span>花销</span>
            <strong class="${spendClass(summary)}">${spendTextInDetail(summary)}</strong>
          </div>
        </div>
        <div class="detail-owner-summary">
          <div class="detail-owner-summary-title">每人收入</div>
          ${ownerRows || `<div class="detail-owner-row"><span>暂无收入人</span><strong class="muted-color">--</strong></div>`}
        </div>
      `;
    }

    function renderDetailPage() {
      const detail = state.detail;
      if (!detail) return;
      const typeLabel = detail.type === "income" ? "收入" : detail.type === "saved" ? "存入" : "";
      const timeLabel = detail.month ? `${detail.year}年${detail.month}月` : `${detail.year}年`;
      els.detailTitle.textContent = `${timeLabel}${typeLabel}明细`;
      els.detailActions.classList.toggle("is-single", detail.type !== "all");
      els.detailActions.innerHTML = detail.type === "all"
        ? `
          <button class="primary" type="button" data-detail-add="income">又赚一笔</button>
          <button class="primary" type="button" data-detail-add="saved">又存一笔</button>
        `
        : `<button class="primary" type="button" data-detail-add="${detail.type}">${detail.type === "saved" ? "又存一笔" : "又赚一笔"}</button>`;
      renderDetailSummary(detail);
      renderEntries(els.detailList, entriesForDetail(detail), `这段时间还没有${typeLabel}记录。`);
    }

    function dateFromDetail(detail) {
      if (!detail?.year) return toDateInput(new Date());
      if (!detail.month) {
        return detail.year === new Date().getFullYear() ? toDateInput(new Date()) : `${detail.year}-01-01`;
      }
      const now = new Date();
      const day = detail.year === now.getFullYear() && detail.month === now.getMonth() + 1
        ? now.getDate()
        : 1;
      return `${detail.year}-${String(detail.month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function incomePayday(owner) {
      return owner === "梁" ? 15 : 5;
    }

    function incomeDateForContext(owner = els.owner.value, detail = state.detail) {
      const now = new Date();
      const year = detail?.year || state.entryViewYear || now.getFullYear();
      const month = detail?.month || (year === now.getFullYear() ? now.getMonth() + 1 : 1);
      return `${year}-${String(month).padStart(2, "0")}-${String(incomePayday(owner)).padStart(2, "0")}`;
    }

    function applyIncomeDateFromOwner() {
      if (state.entryType !== "income" || state.editingId) return;
      els.date.value = incomeDateForContext();
      updateDateChip();
    }

    function addFromDetail(type) {
      const detail = state.detail;
      if (!detail) return;
      openEntryModal(type, detail);
    }

    function sortedEntries(entries = state.entries) {
      return [...entries].sort((a, b) => {
        const dateCompare = (b.date || "").localeCompare(a.date || "");
        if (dateCompare) return dateCompare;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
    }

    function entryMetaRows(item) {
      const row = (label, value, className = "") => `
        <div class="record-meta-row">
          <span>${label}</span>
          <span class="${className}">${value}</span>
        </div>
      `;
      if (item.type === "saved") {
        const profit = savedProfit(item);
        return [
          row("位置", escapeHtml(item.category)),
          item.date ? row("本月存入", moneyInRecord(savedAmount(item))) : "",
          row("当前总数", moneyInRecord(savedCurrentValue(item))),
          row("本月收益", moneyInRecord(profit), profitClass(profit)),
          item.note ? row("备注", escapeHtml(item.note)) : ""
        ].join("");
      }
      return [
        row("分类", escapeHtml(item.category)),
        row("收入人", escapeHtml(item.owner || "未分配")),
        item.note ? row("备注", escapeHtml(item.note)) : ""
      ].join("");
    }

    function renderEntries(container, entries, emptyText) {
      const list = sortedEntries(entries);
      if (!list.length) {
        container.innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
      }
      container.innerHTML = list.map(item => `
        <article class="record-card ${item.type === "income" ? "income-entry" : "saved-entry"}">
          <div class="record-main">
            <div class="record-title-row">
              <strong>${item.type === "income" ? "收入" : "存入"}</strong>
              <span class="record-date">${item.type === "saved" ? (item.date || "期初") : item.date}</span>
            </div>
            <div class="record-meta-grid">${entryMetaRows(item)}</div>
          </div>
          <div class="record-side">
            <div class="amount ${item.type === "income" ? "income-color" : ((item.date ? savedAmount(item) : savedCurrentValue(item)) < 0 ? "loss-color" : "saved-color")}">${moneyInRecord(item.type === "saved" ? (item.date ? savedAmount(item) : savedCurrentValue(item)) : item.amount)}</div>
            <div class="mini-actions">
              <button data-action="edit" data-id="${item.id}" aria-label="编辑">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
              </button>
              <button data-action="delete" data-id="${item.id}" aria-label="删除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M3 6h18"></path>
                  <path d="M8 6V4h8v2"></path>
                  <path d="M6 6l1 15h10l1-15"></path>
                  <path d="M10 11v6"></path>
                  <path d="M14 11v6"></path>
                </svg>
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function filteredEntries() {
      const query = els.search.value.trim().toLowerCase();
      const type = els.filterType.value;
      return state.entries
        .filter(item => type === "all" || item.type === type)
        .filter(item => {
          const haystack = `${item.category} ${item.owner || ""} ${item.note}`.toLowerCase();
          return !query || haystack.includes(query);
        });
    }

    function renderEntryList() {
      const isSaved = state.entryType === "saved";
      els.entryListTitle.textContent = isSaved ? "存入明细" : "收入明细";
      const selectedYear = clampVisibleYear(state.entryViewYear);
      const entries = state.entries
        .filter(item => item.type === state.entryType)
        .filter(item => Number((item.date || "").slice(0, 4)) === selectedYear);
      renderEntries(els.entryList, entries, isSaved ? "还没有存入记录。" : "还没有收入记录。");
    }

    function renderOverviewLists() {
      ensurePickerList("owner");
      ensurePickerList("category");
      ensurePickerList("saved");
      state.overviewDetailYear = clampVisibleYear(state.overviewDetailYear);
      document.querySelectorAll("[data-overview-detail-type]").forEach(button => {
        button.classList.toggle("active", button.dataset.overviewDetailType === state.overviewDetailType);
      });

      const years = Array.from(
        new Set([
          ...state.entries
            .map(item => Number((item.date || "").slice(0, 4)))
            .filter(year => Number.isFinite(year) && year >= MIN_YEAR && year <= currentYear()),
          ...Array.from({ length: currentYear() - MIN_YEAR + 1 }, (_, index) => MIN_YEAR + index)
        ])
      ).sort((a, b) => b - a);

      const optionHtml = (items, selected, allLabel = "全部") => [
        `<option value="all">${allLabel}</option>`,
        ...items.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`)
      ].join("");

      els.overviewDetailYear.innerHTML = years.map(year => `<option value="${year}">${year}</option>`).join("");
      els.overviewDetailYear.value = String(years.includes(state.overviewDetailYear) ? state.overviewDetailYear : years[0]);
      state.overviewDetailYear = Number(els.overviewDetailYear.value);

      els.overviewOwnerFilter.innerHTML = optionHtml(incomeOwners, state.overviewOwnerFilter);
      els.overviewOwnerFilter.value = incomeOwners.includes(state.overviewOwnerFilter) ? state.overviewOwnerFilter : "all";
      state.overviewOwnerFilter = els.overviewOwnerFilter.value;

      els.overviewIncomeCategoryFilter.innerHTML = optionHtml(categories.income, state.overviewIncomeCategoryFilter);
      els.overviewIncomeCategoryFilter.value = categories.income.includes(state.overviewIncomeCategoryFilter) ? state.overviewIncomeCategoryFilter : "all";
      state.overviewIncomeCategoryFilter = els.overviewIncomeCategoryFilter.value;

      els.overviewSavedPlaceFilter.innerHTML = optionHtml(categories.saved, state.overviewSavedPlaceFilter);
      els.overviewSavedPlaceFilter.value = categories.saved.includes(state.overviewSavedPlaceFilter) ? state.overviewSavedPlaceFilter : "all";
      state.overviewSavedPlaceFilter = els.overviewSavedPlaceFilter.value;

      const isSaved = state.overviewDetailType === "saved";
      els.overviewOwnerFilterField.hidden = isSaved;
      els.overviewIncomeCategoryFilterField.hidden = isSaved;
      els.overviewSavedPlaceFilterField.hidden = !isSaved;

      const entries = state.entries
        .filter(item => item.type === state.overviewDetailType)
        .filter(item => {
          const itemYear = Number((item.date || "").slice(0, 4));
          if (Number.isFinite(itemYear) && itemYear >= MIN_YEAR) return itemYear === state.overviewDetailYear;
          return isSaved && state.overviewDetailYear === MIN_YEAR;
        })
        .filter(item => {
          if (isSaved) {
            return state.overviewSavedPlaceFilter === "all" || item.category === state.overviewSavedPlaceFilter;
          }
          const ownerMatched = state.overviewOwnerFilter === "all" || item.owner === state.overviewOwnerFilter;
          const categoryMatched = state.overviewIncomeCategoryFilter === "all" || item.category === state.overviewIncomeCategoryFilter;
          return ownerMatched && categoryMatched;
        });

      renderEntries(els.overviewDetailList, entries, isSaved ? "还没有符合条件的存入记录。" : "还没有符合条件的收入记录。");
    }

    function weightText(value, hasData = true) {
      return hasData ? `${Number(value).toFixed(1)}` : "--";
    }

    function weightDate(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function sortedWeights(person = state.weightPerson) {
      return state.weightEntries
        .filter(item => item.person === person)
        .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    }

    function weightOnDate(date, person = state.weightPerson) {
      const records = state.weightEntries
        .filter(item => item.person === person && item.date === date)
        .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
      return records[0] || null;
    }

    function previousWeightBefore(date, person = state.weightPerson) {
      return sortedWeights(person).filter(item => item.date < date).at(-1) || null;
    }

    function lastWeightBetween(startDate, endDate, person = state.weightPerson) {
      return sortedWeights(person).filter(item => item.date >= startDate && item.date <= endDate).at(-1) || null;
    }

    function latestWeightBeforeOrAt(date, person = state.weightPerson) {
      return sortedWeights(person).filter(item => item.date <= date).at(-1) || null;
    }

    function weightDeltaClass(delta) {
      if (!Number.isFinite(delta) || delta === 0) return "";
      return delta > 0 ? "up" : "down";
    }

    function weightDeltaText(delta) {
      if (!Number.isFinite(delta) || delta === 0) return "持平";
      return `${delta > 0 ? "+" : ""}${delta.toFixed(1)}`;
    }

    function weightCellHtml({ label, value, hasData, delta, isCurrent, isDay = false, isFuture = false, date = "", person = "" }) {
      const dayAttrs = isDay ? ` role="button" tabindex="0" data-weight-date="${escapeHtml(date)}" data-weight-person="${escapeHtml(person)}"` : "";
      const trendClass = hasData ? weightDeltaClass(delta) : "";
      const cardTrendClass = trendClass ? `is-${trendClass}` : "";
      return `
        <div class="weight-cell ${isCurrent ? "is-current" : ""} ${isFuture ? "is-future" : ""} ${hasData ? "" : "is-no-data"} ${isDay ? "is-day" : ""} ${cardTrendClass}"${dayAttrs}>
          <div class="weight-cell-title">${label}</div>
          <div class="weight-value">${weightText(value, hasData)}</div>
          <div class="weight-delta ${weightDeltaClass(delta)}">${hasData ? weightDeltaText(delta) : "--"}</div>
        </div>
      `;
    }

    function renderWeightDayGrid() {
      const maxDay = daysInMonth(state.weightYear, state.weightMonth);
      const today = toDateInput(new Date());
      const firstWeekday = (new Date(state.weightYear, state.weightMonth - 1, 1).getDay() + 6) % 7;
      const weekdays = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
      const chineseMonths = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
      els.weightPeriodLabel.textContent = `${state.weightYear} ${chineseMonths[state.weightMonth - 1]}`;
      els.weightGrid.classList.add("is-day-calendar");
      const weekdayHeader = weekdays.map(day => `<div class="weight-weekday">${day}</div>`).join("");
      const leadingBlanks = Array.from({ length: firstWeekday }, () => `<div class="weight-cell is-empty" aria-hidden="true"></div>`).join("");
      const dayCells = Array.from({ length: maxDay }, (_, index) => {
        const day = index + 1;
        const date = weightDate(state.weightYear, state.weightMonth, day);
        const record = weightOnDate(date);
        const previous = previousWeightBefore(date);
        const delta = record && previous ? record.weight - previous.weight : NaN;
        const isFuture = date > today;
        return weightCellHtml({
          label: `${day}`,
          value: record?.weight,
          hasData: Boolean(record),
          delta,
          isCurrent: date === today,
          isFuture,
          isDay: true,
          date,
          person: state.weightPerson
        });
      }).join("");
      els.weightGrid.innerHTML = `${weekdayHeader}${leadingBlanks}${dayCells}`;
    }

    function renderWeightMonthGrid() {
      const maxMonth = 12;
      els.weightPeriodLabel.textContent = `${state.weightYear}年`;
      els.weightGrid.classList.remove("is-day-calendar");
      els.weightGrid.innerHTML = Array.from({ length: maxMonth }, (_, index) => {
        const month = index + 1;
        const start = weightDate(state.weightYear, month, 1);
        const end = weightDate(state.weightYear, month, daysInMonth(state.weightYear, month));
        const record = lastWeightBetween(start, end);
        const previous = previousWeightBefore(start);
        const delta = record && previous ? record.weight - previous.weight : NaN;
        const isFuture = state.weightYear === currentYear() && month > currentMonth();
        return weightCellHtml({
          label: `${month}月`,
          value: record?.weight,
          hasData: Boolean(record),
          delta,
          isCurrent: state.weightYear === currentYear() && month === currentMonth(),
          isFuture
        });
      }).join("");
    }

    function renderWeightBarChart() {
      const items = [];
      if (state.weightPeriod === "day") {
        const maxDay = daysInMonth(state.weightYear, state.weightMonth);
        const monthPrefix = `${state.weightYear}-${String(state.weightMonth).padStart(2, "0")}-`;
        if (!state.weightSelectedDate?.startsWith(monthPrefix)) {
          state.weightSelectedDate = state.weightYear === currentYear() && state.weightMonth === currentMonth()
            ? toDateInput(new Date())
            : weightDate(state.weightYear, state.weightMonth, 1);
        }
        for (let day = 1; day <= maxDay; day += 1) {
          const date = weightDate(state.weightYear, state.weightMonth, day);
          const record = weightOnDate(date);
          const previous = previousWeightBefore(date);
          items.push({
            label: `${day}`,
            date,
            value: record?.weight,
            hasData: Boolean(record),
            delta: record && previous ? record.weight - previous.weight : NaN,
            isSelected: date === state.weightSelectedDate
          });
        }
      } else {
        if (!Number.isInteger(state.weightSelectedMonth) || state.weightSelectedMonth < 1 || state.weightSelectedMonth > 12) {
          state.weightSelectedMonth = state.weightYear === currentYear() ? currentMonth() : 1;
        }
        for (let month = 1; month <= 12; month += 1) {
          const start = weightDate(state.weightYear, month, 1);
          const end = weightDate(state.weightYear, month, daysInMonth(state.weightYear, month));
          const record = lastWeightBetween(start, end);
          const previous = previousWeightBefore(start);
          items.push({
            label: `${month}月`,
            value: record?.weight,
            hasData: Boolean(record),
            delta: record && previous ? record.weight - previous.weight : NaN,
            month,
            isSelected: month === state.weightSelectedMonth
          });
        }
      }

      const values = items.filter(item => item.hasData).map(item => item.value);
      const min = values.length ? Math.min(...values) : 0;
      const max = values.length ? Math.max(...values) : 1;
      const range = Math.max(1, max - min);
      const bars = items.map((item, index) => {
        const trend = weightDeltaClass(item.delta);
        const barHeight = item.hasData ? Math.max(18, 24 + ((item.value - min) / range) * 78) : 4;
        const tipLineHeight = Math.max(14, 141 - barHeight);
        const edgeClass = item.isSelected && ["day", "month"].includes(state.weightPeriod)
          ? (index < 3 ? "is-edge-start" : index >= items.length - 3 ? "is-edge-end" : "")
          : "";
        const selectedLabel = item.date
          ? `${state.weightMonth}月${Number(item.label)}日`
          : `${item.month}月`;
        const barTarget = item.date
          ? ` data-weight-bar-date="${item.date}"`
          : item.month
            ? ` data-weight-bar-month="${item.month}"`
            : "";
        return `
          <div class="weight-bar-item ${item.hasData && trend ? `is-${trend}` : item.hasData ? "" : "is-empty"} ${item.isSelected ? "is-selected" : ""} ${edgeClass}" style="--bar-height:${barHeight.toFixed(1)}px; --tip-line-height:${tipLineHeight.toFixed(1)}px"${barTarget ? ` role="button" tabindex="0"${barTarget}` : ""}>
            ${item.isSelected ? `<div class="weight-selected-tip is-${trend || "empty"}"><span>${selectedLabel}</span><strong>${item.hasData ? weightText(item.value, true) : "无"}</strong></div>` : ""}
            <span class="weight-bar-value">${item.hasData ? weightText(item.value, true) : ""}</span>
            <span class="weight-bar"></span>
            <span class="weight-bar-label">${item.label}</span>
          </div>
        `;
      }).join("");

      els.weightBarChart.innerHTML = `
        <div class="weight-bar-chart-header">
          <h3>${state.weightPeriod === "day" ? "每日对比" : "每月对比"}</h3>
          <span>${state.weightPeriod === "day" ? "按日" : "按月"}</span>
        </div>
        <div class="weight-bars ${state.weightPeriod === "day" ? "is-daily" : "is-monthly"}" aria-label="${state.weightPeriod === "day" ? "当月每日体重" : "全年每月体重"}">${bars}</div>
      `;
    }

    function renderWeightPersonTabs() {
      const personCount = Math.max(1, incomeOwners.length);
      els.weightPerson.style.setProperty("--weight-person-count", personCount);
      els.weightPerson.style.setProperty("width", `${personCount * 36 + Math.max(0, personCount - 1) * 3 + 6}px`, "important");
      els.weightPerson.innerHTML = incomeOwners.map(person => `
        <button class="mode-btn ${person === state.weightPerson ? "active" : ""}" type="button" data-weight-person="${escapeHtml(person)}">${escapeHtml(person)}</button>
      `).join("");
    }

    function renderWeight() {
      ensurePickerList("owner");
      state.weightYear = clampVisibleYear(state.weightYear);
      if (state.weightYear === currentYear()) state.weightMonth = Math.min(state.weightMonth, currentMonth());
      state.weightMonth = Math.max(1, Math.min(12, state.weightMonth));
      if (!["day", "month"].includes(state.weightPeriod)) state.weightPeriod = "day";
      if (!incomeOwners.includes(state.weightPerson)) state.weightPerson = incomeOwners[0] || defaultIncomeOwners[0];
      syncSelectOptions(els.weightFormPerson, incomeOwners);
      renderWeightPersonTabs();
      document.querySelectorAll("[data-weight-period]").forEach(button => {
        button.classList.toggle("active", button.dataset.weightPeriod === state.weightPeriod);
      });
      els.weightGrid.hidden = false;
      if (state.weightPeriod === "day") renderWeightDayGrid();
      else renderWeightMonthGrid();
      renderWeightBarChart();
    }

    function settingList(kind) {
      if (kind === "owner") return incomeOwners;
      if (kind === "saved") return categories.saved;
      return categories.income;
    }

    function ensurePickerList(kind) {
      if (kind === "owner" && !incomeOwners.length) incomeOwners = [...defaultIncomeOwners];
      if (kind === "category" && !categories.income.length) categories.income = [...defaultCategories.income];
      if (kind === "saved" && !categories.saved.length) categories.saved = [...defaultCategories.saved];
      return settingList(kind);
    }

    function selectedSetting(kind) {
      return kind === "owner" ? els.owner.value : els.category.value;
    }

    function setSelectedSetting(kind, value) {
      if (kind === "owner") {
        ensureSettingValue("owner", value);
        if (![...els.owner.options].some(option => option.value === value)) {
          els.owner.add(new Option(value, value));
        }
        els.owner.value = value;
        applyIncomeDateFromOwner();
      } else {
        ensureSettingValue(kind, value);
        if (![...els.category.options].some(option => option.value === value)) {
          els.category.add(new Option(value, value));
        }
        els.category.value = value;
      }
      renderPickerTriggers();
    }

    function renderPickerTriggers() {
      els.ownerPickerTrigger.textContent = els.owner.value || "请选择收入人";
      els.categoryPickerTrigger.textContent = els.category.value || (state.entryType === "saved" ? "请选择存款位置" : "请选择分类");
      els.categoryPickerTrigger.dataset.pickerKind = state.entryType === "saved" ? "saved" : "category";
      els.ownerPickerTrigger.classList.toggle("is-placeholder", !els.owner.value);
      els.categoryPickerTrigger.classList.toggle("is-placeholder", !els.category.value);
    }

    function ensureCurrentSelectValues() {
      const categoryList = categories[state.entryType] || [];
      if (!categoryList.includes(els.category.value)) {
        els.category.value = state.entryType === "saved" ? "" : (categoryList[0] || "");
      }
      if (!incomeOwners.includes(els.owner.value)) {
        els.owner.value = incomeOwners[0] || "";
      }
    }

    function renderPicker() {
      const kind = state.pickerKind;
      if (!kind) return;
      const list = ensurePickerList(kind);
      els.pickerTitle.textContent = kind === "owner" ? "收入人" : (kind === "saved" ? "存款位置" : "分类");
      els.pickerList.innerHTML = `
        ${list.map((item, index) => `
          <div class="picker-item ${selectedSetting(kind) === item ? "active" : ""}" data-picker-action="select" data-index="${index}">
            <button class="picker-name" type="button" data-picker-action="select" data-index="${index}">${escapeHtml(item)}</button>
            <button class="picker-icon" type="button" data-picker-action="rename" data-index="${index}" aria-label="改名">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </button>
            <button class="picker-icon danger-icon" type="button" data-picker-action="delete" data-index="${index}" aria-label="删除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M6 6l1 15h10l1-15"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
              </svg>
            </button>
          </div>
        `).join("")}
        ${state.pickerAdding ? `
          <form class="picker-add-form" data-picker-add-form>
            <input class="picker-add-input" autocomplete="off" placeholder="${kind === "owner" ? "输入收入人" : (kind === "saved" ? "输入存款位置" : "输入分类")}">
            <button class="picker-save" type="submit">保存</button>
            <button class="picker-cancel" type="button" data-picker-action="cancel-add">取消</button>
          </form>
        ` : `<button class="picker-add" type="button" data-picker-action="add">+ 新增</button>`}
      `;
      const input = els.pickerList.querySelector(".picker-add-input");
      if (input) setTimeout(() => input.focus(), 0);
    }

    function openPicker(kind) {
      state.pickerKind = kind;
      state.pickerAdding = false;
      ensurePickerList(kind);
      saveSettings();
      renderPicker();
      els.pickerLayer.hidden = false;
      syncModalState();
    }

    function closePicker() {
      state.pickerKind = null;
      state.pickerAdding = false;
      els.pickerLayer.hidden = true;
      els.pickerLayer.classList.remove("is-year-picker");
      els.pickerList.classList.remove("year-picker-grid");
      els.pickerList.classList.remove("checkin-week-picker-list");
      state.checkinPickerYear = null;
      syncModalState();
    }

    function settingUsed(kind, name) {
      return state.entries.some(item => {
        if (kind === "owner") return item.type === "income" && item.owner === name;
        if (kind === "category") return item.type === "income" && item.category === name;
        return item.type === "saved" && item.category === name;
      });
    }

    function addSetting(kind, name) {
      const value = String(name || "").trim();
      if (!value) {
        showToast("名称不能为空");
        return;
      }
      const list = settingList(kind);
      if (list.includes(value)) {
        showToast("已经有这个名称了");
        return;
      }
      list.push(value);
      saveSettings();
      setEntryType(state.entryType);
      if (state.pickerKind === kind) {
        setSelectedSetting(kind, value);
        state.pickerAdding = false;
        renderPicker();
      }
      renderPickerTriggers();
      render();
      showToast("已新增");
    }

    function renameSetting(kind, oldName) {
      const list = settingList(kind);
      const nextName = prompt("改成什么名字？", oldName);
      const value = String(nextName || "").trim();
      if (!value || value === oldName) return;
      if (list.includes(value)) {
        showToast("已经有这个名称了");
        return;
      }
      const index = list.indexOf(oldName);
      if (index < 0) return;
      const wasSelected = selectedSetting(kind) === oldName;
      list[index] = value;
      state.entries.forEach(item => {
        if (kind === "owner" && item.type === "income" && item.owner === oldName) item.owner = value;
        if (kind === "category" && item.type === "income" && item.category === oldName) item.category = value;
        if (kind === "saved" && item.type === "saved" && item.category === oldName) item.category = value;
      });
      saveSettings();
      save();
      setEntryType(state.entryType);
      if (wasSelected || state.pickerKind === kind) setSelectedSetting(kind, value);
      renderPicker();
      render();
      showToast("已改名");
    }

    function deleteSetting(kind, name) {
      const list = settingList(kind);
      if (list.length <= 1) {
        showToast("至少保留一个");
        return;
      }
      if (settingUsed(kind, name)) {
        showToast("已有记录使用，先改名或调整记录");
        return;
      }
      if (!confirm(`确定删除“${name}”吗？`)) return;
      const index = list.indexOf(name);
      if (index >= 0) list.splice(index, 1);
      saveSettings();
      setEntryType(state.entryType);
      ensureCurrentSelectValues();
      if (state.pickerKind === kind) renderPicker();
      renderPickerTriggers();
      render();
      showToast("已删除");
    }

    function handlePickerAction(event) {
      const button = event.target.closest("button[data-picker-action]") || event.target.closest(".picker-item[data-picker-action]");
      if (!button) return;
      event.preventDefault();
      event.stopPropagation();
      const kind = state.pickerKind;
      const { pickerAction } = button.dataset;
      const list = ensurePickerList(kind);
      const name = list[Number(button.dataset.index)];
      if (pickerAction === "select") {
        if (!name) return;
        setSelectedSetting(kind, name);
        closePicker();
      }
      if (pickerAction === "add") {
        state.pickerAdding = true;
        renderPicker();
      }
      if (pickerAction === "cancel-add") {
        state.pickerAdding = false;
        renderPicker();
      }
      if (pickerAction === "rename" && name) renameSetting(kind, name);
      if (pickerAction === "delete" && name) deleteSetting(kind, name);
    }

    function handlePickerSubmit(event) {
      const form = event.target.closest("[data-picker-add-form]");
      if (!form) return;
      event.preventDefault();
      const input = form.querySelector(".picker-add-input");
      addSetting(state.pickerKind, input?.value);
    }

    function setEntryDropdown(open) {
      els.entryDropdown.hidden = !open;
      els.openEntryForm.hidden = open;
      syncModalState();
      if (open) {
        els.cancelEdit.hidden = false;
      }
    }

    function syncModalState() {
      const hasEntryModal = !els.entryDropdown.hidden;
      const hasPicker = !els.pickerLayer.hidden;
      const isModalOpen = hasEntryModal || hasPicker;
      document.documentElement.classList.toggle("modal-open", isModalOpen);
      document.body.classList.toggle("modal-open", isModalOpen);
    }

    function checkinDateObject(value) {
      return new Date(`${value}T12:00:00`);
    }

    function checkinDateKey(date) {
      return toDateInput(date);
    }

    function checkinPeriodDates() {
      const selected = checkinDateObject(state.checkinDate);
      if (state.checkinPeriod === "week") {
        const mondayOffset = (selected.getDay() + 6) % 7;
        const start = new Date(selected);
        start.setDate(selected.getDate() - mondayOffset);
        return Array.from({ length: 7 }, (_, index) => {
          const date = new Date(start);
          date.setDate(start.getDate() + index);
          return date;
        });
      }
      if (state.checkinPeriod === "month") {
        const start = new Date(selected.getFullYear(), selected.getMonth(), 1, 12);
        return Array.from({ length: new Date(selected.getFullYear(), selected.getMonth() + 1, 0).getDate() }, (_, index) => {
          const date = new Date(start);
          date.setDate(index + 1);
          return date;
        });
      }
      const year = selected.getFullYear();
      const daysInYear = (Date.UTC(year + 1, 0, 1) - Date.UTC(year, 0, 1)) / 86400000;
      return Array.from({ length: daysInYear }, (_, index) => new Date(year, 0, index + 1, 12));
    }

    function checkinRangeLabel() {
      const dates = checkinPeriodDates();
      if (state.checkinPeriod === "week") {
        const first = dates[0];
        const last = dates[dates.length - 1];
        const formatMonthDay = date => `${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}`;
        return `${formatMonthDay(first)} - ${formatMonthDay(last)}`;
      }
      if (state.checkinPeriod === "month") {
        const date = checkinDateObject(state.checkinDate);
        return `${date.getFullYear()}年${date.getMonth() + 1}月`;
      }
      return `${checkinDateObject(state.checkinDate).getFullYear()}年`;
    }

    function openCheckinTimePicker() {
      if (state.checkinPeriod === "year") {
        const selectedYear = checkinDateObject(state.checkinDate).getFullYear();
        state.pickerKind = "checkin-year";
        state.pickerAdding = false;
        els.pickerLayer.classList.add("is-year-picker");
        els.pickerTitle.textContent = "选择年份";
        els.pickerList.classList.add("year-picker-grid");
        els.pickerList.innerHTML = CHECKIN_PICKER_YEARS
          .map(year => `<button class="year-picker-option ${year === selectedYear ? "active" : ""}" type="button" data-checkin-year="${year}" aria-pressed="${year === selectedYear}">${year}年</button>`)
          .join("");
        els.pickerLayer.hidden = false;
        syncModalState();
        return;
      }

      const selectedDate = checkinDateObject(state.checkinDate);
      const currentDate = checkinDateObject(toDateInput(new Date()));
      els.pickerLayer.classList.add("is-year-picker");
      els.pickerList.classList.add("year-picker-grid");

      if (state.checkinPeriod === "month") {
        const selectedMonth = state.checkinDate.slice(0, 7);
        const options = [];
        for (const year of CHECKIN_PICKER_YEARS) {
          for (let month = 1; month <= 12; month += 1) {
            const value = `${year}-${String(month).padStart(2, "0")}`;
            options.push(`<button class="year-picker-option ${value === selectedMonth ? "active" : ""}" type="button" data-checkin-month="${value}">${year}年${month}月</button>`);
          }
        }
        state.pickerKind = "checkin-month";
        state.pickerAdding = false;
        els.pickerTitle.textContent = "选择月份";
        els.pickerList.innerHTML = options.reverse().join("");
        els.pickerLayer.hidden = false;
        syncModalState();
        return;
      }

      const pickerYear = state.checkinPickerYear || selectedDate.getFullYear();
      const currentWeekStart = (() => {
        const start = new Date(currentDate);
        start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
        return start;
      })();
      const selectedWeekStart = checkinPeriodDates()[0];
      const formatWeekOption = start => {
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        const format = date => `${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}`;
        return `${format(start)} - ${format(end)}`;
      };
      const weekStart = new Date(pickerYear, 0, 1, 12);
      weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
      const lastWeekDate = new Date(pickerYear, 11, 31, 12);
      const maxWeekDate = pickerYear === currentDate.getFullYear() && lastWeekDate > currentDate
        ? currentDate
        : lastWeekDate;
      const weekOptions = [];
      for (let start = new Date(weekStart); start <= maxWeekDate; start.setDate(start.getDate() + 7)) {
        const value = toDateInput(start);
        const isCurrentWeek = toDateInput(currentWeekStart) === value;
        const isSelectedWeek = toDateInput(selectedWeekStart) === value;
        weekOptions.push(`<button class="year-picker-option checkin-week-picker-option ${isSelectedWeek ? "is-selected" : ""} ${isCurrentWeek ? "is-current-week" : ""}" type="button" data-checkin-week-date="${value}">${formatWeekOption(start)}</button>`);
      }
      state.pickerKind = "checkin-week";
      state.pickerAdding = false;
      els.pickerTitle.textContent = "选择周";
      els.pickerList.classList.remove("year-picker-grid");
      els.pickerList.classList.add("checkin-week-picker-list");
      const yearOptions = CHECKIN_PICKER_YEARS
        .map(year => `<button class="checkin-week-picker-year ${year === pickerYear ? "is-selected" : ""}" type="button" data-checkin-week-year="${year}">${year}年</button>`)
        .join("");
      els.pickerList.innerHTML = `
        <div class="checkin-week-picker-toolbar">
          <button class="checkin-week-picker-shortcut" type="button" data-checkin-this-week>本周</button>
          <div class="checkin-week-picker-years">${yearOptions}</div>
        </div>
        <div class="checkin-week-picker-options">${weekOptions.reverse().join("")}</div>
      `;
      els.pickerLayer.hidden = false;
      syncModalState();
    }

    function selectCheckinTime() {
      const value = els.checkinTimePicker.value;
      if (!value) return;
      if (state.checkinPeriod === "month") {
        state.checkinDate = `${value}-01`;
      } else if (state.checkinPeriod === "year") {
        state.checkinDate = `${value.slice(0, 4)}-01-01`;
      } else {
        state.checkinDate = value;
      }
      renderCheckins();
    }

    function checkinStats(item, dates) {
      const completed = dates.filter(date => item.records[checkinDateKey(date)]).length;
      const available = dates.filter(date => date <= new Date()).length || dates.length;
      return { completed, percent: Math.round((completed / available) * 100) };
    }

    function renderCheckinCard(item) {
      const selected = checkinDateObject(state.checkinDate);
      const dates = checkinPeriodDates();
      const stats = checkinStats(item, dates);
      const color = escapeHtml(item.color);
      let content = "";

      if (state.checkinPeriod === "year") {
        const year = selected.getFullYear();
        const daysInYear = (Date.UTC(year + 1, 0, 1) - Date.UTC(year, 0, 1)) / 86400000;
        const leadingDays = 0;
        const dots = Array.from({ length: leadingDays + daysInYear }, (_, index) => {
          if (index < leadingDays) return `<span class="checkin-year-dot is-empty" aria-hidden="true"></span>`;
          const dayIndex = index - leadingDays;
          const date = new Date(year, 0, dayIndex + 1, 12);
          const key = checkinDateKey(date);
          const isComplete = Boolean(item.records[key]);
          const isFuture = key > checkinDateKey(new Date());
          const isToday = key === checkinDateKey(new Date());
          return `<span class="checkin-year-dot ${isComplete ? "is-complete" : ""} ${isFuture ? "is-future" : ""} ${isToday ? "is-today" : ""}" style="--checkin-color:${color}" title="${key}${isComplete ? " 已完成" : " 未完成"}"></span>`;
        }).join("");
        content = `<div class="checkin-year-grid">${dots}</div>`;
      } else {
        const leading = state.checkinPeriod === "month" ? ((dates[0].getDay() + 6) % 7) : 0;
        const weekdayLabels = ["一", "二", "三", "四", "五", "六", "日"].map(day => `<span class="checkin-weekday">${day}</span>`).join("");
        const weekdays = state.checkinPeriod === "month" ? weekdayLabels : "";
        const blanks = Array.from({ length: leading }, () => `<button class="checkin-day is-empty" tabindex="-1" aria-hidden="true"></button>`).join("");
        const days = dates.map(date => {
          const key = checkinDateKey(date);
          const isFuture = key > checkinDateKey(new Date());
          const isToday = key === checkinDateKey(new Date());
          const isComplete = Boolean(item.records[key]);
          return `<button class="checkin-day ${isComplete ? "is-complete" : ""} ${isToday ? "is-today" : ""} ${isFuture ? "is-future" : ""}" style="--checkin-color:${color}" data-checkin-id="${escapeHtml(item.id)}" data-checkin-date="${key}" aria-label="${key}${isComplete ? " 已完成" : " 未完成"}">${date.getDate()}</button>`;
        }).join("");
        content = `<div class="checkin-days">${weekdays}${blanks}${days}</div>`;
      }

      return `<article class="checkin-card ${state.checkinPeriod === "week" ? "is-week" : state.checkinPeriod === "month" ? "is-month" : "is-year"}">
        <div class="checkin-card-head">
          <div class="checkin-name"><span>${escapeHtml(item.title)}</span></div>
          <button class="checkin-delete" type="button" data-checkin-delete="${escapeHtml(item.id)}" aria-label="删除${escapeHtml(item.title)}">×</button>
        </div>
        ${state.checkinPeriod === "week" ? "" : `<div class="checkin-stats" style="--checkin-color:${color}"><span>完成 <strong>${stats.completed}</strong> 次</span><span>完成率 <strong>${stats.percent}%</strong></span></div>`}
        ${content}
      </article>`;
    }

    function renderCheckins() {
      if (!els.checkinList) return;
      els.checkinRangeLabel.textContent = checkinRangeLabel();
      els.checkinList.classList.toggle("is-week-list", state.checkinPeriod === "week");
      els.checkinList.classList.toggle("is-month-list", state.checkinPeriod === "month");
      els.checkinList.classList.toggle("is-year-list", state.checkinPeriod === "year");
      document.querySelectorAll("[data-checkin-period]").forEach(button => {
        button.classList.toggle("active", button.dataset.checkinPeriod === state.checkinPeriod);
      });
      const weekdayHeader = state.checkinPeriod === "week"
        ? `<div class="checkin-global-weekdays"><div class="checkin-weekdays">${["一", "二", "三", "四", "五", "六", "日"].map(day => `<span class="checkin-weekday">${day}</span>`).join("")}</div></div>`
        : "";
      els.checkinList.innerHTML = state.checkins.length
        ? `${weekdayHeader}${state.checkins.map(renderCheckinCard).join("")}`
        : `<div class="empty-state">还没有打卡项目，先新增一个吧</div>`;
    }

    function addCheckin() {
      renderCheckinColorPicker();
      els.checkinAddForm.classList.add("is-open");
      els.checkinNameInput.focus();
    }

    function renderCheckinColorPicker() {
      if (!els.checkinColorPicker) return;
      els.checkinColorPicker.innerHTML = CHECKIN_COLORS.map(color => `<button type="button" class="checkin-color-swatch ${color === state.checkinDraftColor ? "is-selected" : ""}" style="--swatch-color:${color};background:${color}" data-checkin-color="${color}" aria-label="选择颜色 ${color}"></button>`).join("");
    }

    function saveNewCheckin(event) {
      event.preventDefault();
      const title = String(els.checkinNameInput.value || "").trim();
      if (!title) return;
      state.checkins.push({ id: crypto.randomUUID(), title, emoji: "✓", color: state.checkinDraftColor, records: {} });
      save();
      els.checkinNameInput.value = "";
      state.checkinDraftColor = CHECKIN_COLORS[5];
      els.checkinAddForm.classList.remove("is-open");
      renderCheckins();
      showToast("已新增打卡");
    }

    function toggleCheckin(id, date) {
      const item = state.checkins.find(checkin => checkin.id === id);
      if (!item || date > checkinDateKey(new Date())) return showToast("还没到这一天");
      item.records[date] = !item.records[date];
      if (!item.records[date]) delete item.records[date];
      save();
      renderCheckins();
    }

    function deleteCheckin(id) {
      const item = state.checkins.find(checkin => checkin.id === id);
      if (!item || !confirm(`确定删除“${item.title}”吗？`)) return;
      state.checkins = state.checkins.filter(checkin => checkin.id !== id);
      save();
      renderCheckins();
      showToast("已删除");
    }

    function render() {
      renderSummary();
      renderPeriodGrid();
      renderOverviewLists();
      renderWeight();
      renderCheckins();
      renderEntryPeriodGrid();
      renderEntryList();
      renderDetailPage();
      renderPickerTriggers();
      updateComputedProfitPreview();
      updateDateChip();
    }

    function syncSelectOptions(select, list) {
      const current = select.value;
      select.innerHTML = list.map(item => `<option>${escapeHtml(item)}</option>`).join("");
      if (list.includes(current)) select.value = current;
    }

    function updateDateChip() {
      const showChip = state.entryType === "saved" && Boolean(els.date.value);
      els.date.hidden = showChip;
      els.dateChip.hidden = !showChip;
      els.dateChipText.textContent = showChip ? els.date.value : "";
      if (state.entryType !== "saved") {
        els.date.hidden = false;
      }
    }

    function setEntryType(type) {
      const previousCategory = els.category.value;
      const previousOwner = els.owner.value;
      const previousType = state.entryType;
      state.entryType = type;
      document.body.dataset.entryType = type;
      ensurePickerList(type === "saved" ? "saved" : "category");
      ensurePickerList("owner");
      syncSelectOptions(els.category, categories[type]);
      syncSelectOptions(els.owner, incomeOwners);
      els.category.value = type === "saved"
        ? (categories[type].includes(previousCategory) ? previousCategory : (categories[type][0] || ""))
        : (categories[type].includes(previousCategory) ? previousCategory : (categories[type][0] || ""));
      els.owner.value = incomeOwners.includes(previousOwner) ? previousOwner : (incomeOwners[0] || "");
      const isSaved = type === "saved";
      els.openEntryForm.textContent = isSaved ? "又存一笔" : "又赚一笔";
      els.amountLabel.innerHTML = isSaved ? "本月存入（自动）" : '金额<span class="required">*</span>';
      els.categoryLabel.innerHTML = isSaved ? '存款位置<span class="required">*</span>' : '分类<span class="required">*</span>';
      els.amount.placeholder = isSaved ? "根据总数和收益自动计算" : "0.00";
      els.amount.required = !isSaved;
      els.amount.readOnly = isSaved;
      if (!isSaved) els.amount.className = "";
      els.ownerField.hidden = isSaved;
      els.owner.required = !isSaved;
      els.currentValueField.hidden = !isSaved;
      els.currentValueField.style.display = isSaved ? "" : "none";
      els.computedProfitField.hidden = !isSaved;
      els.computedProfitField.style.display = isSaved ? "" : "none";
      els.currentValue.required = isSaved;
      els.computedProfit.required = isSaved;
      if (!isSaved) {
        els.currentValue.value = "";
        els.computedProfit.value = "";
        els.computedProfit.className = "";
      }
      els.date.required = true;
      els.dateLabel.innerHTML = '日期<span class="required">*</span>';
      updateDateChip();
      updateComputedProfitPreview();
      renderPickerTriggers();
      renderEntryPeriodGrid();
      renderEntryList();
    }

    function resetForm(type = state.entryType) {
      state.editingId = null;
      els.form.reset();
      els.amount.className = "";
      els.computedProfit.className = "";
      els.formTitle.textContent = type === "saved" ? "又存一笔" : "又赚一笔";
      els.saveBtn.textContent = "保存";
      els.cancelEdit.textContent = "关闭";
      els.cancelEdit.hidden = true;
      setEntryType(type);
      els.date.value = type === "saved" ? toDateInput(new Date()) : incomeDateForContext(els.owner.value, null);
      updateDateChip();
      updateComputedProfitPreview();
      renderPickerTriggers();
      setEntryDropdown(false);
    }

    function openEntryModal(type = state.entryType, detailContext = null) {
      resetForm(type);
      state.detail = detailContext || null;
      if (type === "income") {
        els.owner.value = incomeOwners.includes(els.owner.value) ? els.owner.value : (incomeOwners[0] || "");
        els.date.value = incomeDateForContext(els.owner.value, detailContext);
      } else {
        els.date.value = detailContext ? dateFromDetail(detailContext) : toDateInput(new Date());
      }
      updateComputedProfitPreview();
      updateDateChip();
      renderPickerTriggers();
      setEntryDropdown(true);
    }

    function setWeightDropdown(open) {
      els.weightDropdown.hidden = !open;
      document.documentElement.classList.toggle("modal-open", open || !els.entryDropdown.hidden || !els.pickerLayer.hidden);
      document.body.classList.toggle("modal-open", open || !els.entryDropdown.hidden || !els.pickerLayer.hidden);
    }

    function openWeightModal() {
      els.weightForm.reset();
      syncSelectOptions(els.weightFormPerson, incomeOwners);
      els.weightFormTitle.textContent = "记录体重";
      els.weightFormPerson.value = state.weightPerson;
      els.weightDate.value = toDateInput(new Date());
      els.weightValue.value = "";
      els.weightNote.value = "";
      setWeightDropdown(true);
    }

    function openWeightDayEditor(date, person = state.weightPerson) {
      const record = weightOnDate(date, person);
      els.weightForm.reset();
      syncSelectOptions(els.weightFormPerson, incomeOwners);
      els.weightFormTitle.textContent = record ? "编辑体重" : "记录体重";
      els.weightFormPerson.value = person;
      els.weightDate.value = date;
      els.weightValue.value = record ? String(record.weight) : "";
      els.weightNote.value = record?.note || "";
      setWeightDropdown(true);
    }

    function saveWeightEntry(event) {
      event.preventDefault();
      const weight = roundMoney(parseNumber(els.weightValue.value));
      if (!els.weightFormPerson.value) {
        showToast("记录人必填");
        return;
      }
      if (!els.weightDate.value) {
        showToast("日期必填");
        return;
      }
      const existingIndex = state.weightEntries.findIndex(item => item.person === els.weightFormPerson.value && item.date === els.weightDate.value);
      if (!els.weightValue.value.trim()) {
        if (existingIndex >= 0) {
          state.weightEntries.splice(existingIndex, 1);
          state.weightPerson = els.weightFormPerson.value;
          state.weightYear = Number(els.weightDate.value.slice(0, 4));
          state.weightMonth = Number(els.weightDate.value.slice(5, 7));
          save();
          renderWeight();
          setWeightDropdown(false);
          showToast("体重记录已删除");
        } else {
          setWeightDropdown(false);
          showToast("未添加空记录");
        }
        return;
      }
      if (weight <= 0) {
        showToast("体重要大于 0");
        return;
      }
      const payload = normalizeWeightEntry({
        id: existingIndex >= 0 ? state.weightEntries[existingIndex].id : crypto.randomUUID(),
        person: els.weightFormPerson.value,
        date: els.weightDate.value,
        weight,
        note: els.weightNote.value.trim(),
        createdAt: existingIndex >= 0 ? state.weightEntries[existingIndex].createdAt : Date.now(),
        updatedAt: Date.now()
      });
      if (existingIndex >= 0) state.weightEntries[existingIndex] = payload;
      else state.weightEntries.push(payload);
      state.weightPerson = payload.person;
      state.weightYear = Number(payload.date.slice(0, 4));
      state.weightMonth = Number(payload.date.slice(5, 7));
      save();
      renderWeight();
      setWeightDropdown(false);
      showToast(existingIndex >= 0 ? "体重已更新" : "体重已记录");
    }

    function draftSavedEntry() {
      const existing = state.entries.find(item => item.id === state.editingId);
      const draft = {
        id: state.editingId || "__draft_saved_entry__",
        type: "saved",
        schemaVersion: 2,
        amount: 0,
        currentValue: roundMoney(parseNumber(els.currentValue.value)),
        periodProfit: roundMoney(parseNumber(els.computedProfit.value)),
        date: els.date.value || "",
        createdAt: existing?.createdAt || Date.now()
      };
      draft.amount = calculatedSavedAmount(draft);
      return draft;
    }

    function updateComputedProfitPreview() {
      if (state.entryType !== "saved" || !els.computedProfit) return;
      if (!els.currentValue.value.trim() || !els.computedProfit.value.trim()) {
        els.amount.value = "";
        els.computedProfit.className = "";
        return;
      }
      const saved = calculatedSavedAmount(draftSavedEntry());
      const profit = parseNumber(els.computedProfit.value);
      els.amount.value = money(saved);
      els.amount.className = profitClass(saved);
      els.computedProfit.className = profitClass(profit);
    }

    function upsertEntry(event) {
      event.preventDefault();
      const amount = parseNumber(els.amount.value);
      const isSaved = state.entryType === "saved";
      if (!isSaved && amount <= 0) {
        showToast("金额要大于 0");
        return;
      }
      const existing = state.entries.find(item => item.id === state.editingId);
      if (!isSaved && !els.date.value) {
        showToast("日期必填");
        return;
      }
      if (!isSaved && !els.owner.value) {
        showToast("收入人必填");
        return;
      }
      const currentValue = isSaved ? parseNumber(els.currentValue.value) : 0;
      if (isSaved && !els.currentValue.value.trim()) {
