<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="收支估算">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
    }
  </script>
  <title>收支估算</title>
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench · tone: utilitarian · anchor hue: cobalt */
    :root {
      color-scheme: light;
      --color-paper: oklch(97% 0.012 255);
      --color-paper-2: oklch(94% 0.018 255);
      --color-surface: oklch(99% 0.006 255);
      --color-surface-2: oklch(96.5% 0.013 255);
      --color-ink: oklch(19% 0.035 255);
      --color-muted: oklch(48% 0.045 255);
      --color-muted-2: oklch(68% 0.035 255);
      --color-rule: oklch(88% 0.026 255);
      --color-rule-2: oklch(93% 0.018 255);
      --color-accent: oklch(52% 0.19 255);
      --color-accent-2: oklch(62% 0.16 255);
      --color-focus: oklch(60% 0.18 255);
      --color-success: oklch(51% 0.14 158);
      --color-danger: oklch(53% 0.17 25);
      --color-danger-soft: oklch(96% 0.025 25);
      --color-scrim: oklch(20% 0.035 255 / 0.36);
      --bg: var(--color-paper);
      --panel: var(--color-surface);
      --panel-2: var(--color-surface-2);
      --ink: var(--color-ink);
      --muted: var(--color-muted);
      --muted-2: var(--color-muted-2);
      --line: var(--color-rule);
      --line-2: var(--color-rule-2);
      --accent: var(--color-accent);
      --accent-2: var(--color-accent-2);
      --soft: oklch(93% 0.035 255);
      --soft-2: oklch(97% 0.016 255);
      --income: var(--color-accent);
      --saved: var(--color-ink);
      --spend: var(--color-danger);
      --space-2xs: 4px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --radius-card: 8px;
      --radius-pill: 999px;
      --dur-fast: 120ms;
      --dur-short: 180ms;
      --dur-modal: 260ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --shadow: 0 1px 2px oklch(30% 0.04 255 / 0.05);
      --shadow-soft: 0 1px 2px oklch(30% 0.04 255 / 0.06);
      --font-display: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: var(--font-body);
    }

    * { box-sizing: border-box; }

    html, body { overflow-x: clip; }

    [hidden] { display: none !important; }

    body[data-entry-type="income"] #currentValueField,
    body[data-entry-type="income"] #computedProfitField {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    button:active { transform: translateY(1px); }

    h1, h2, p { margin: 0; }

    .app {
      min-height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      padding: calc(18px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
    }

    .metric {
      min-width: 0;
      padding: 15px 14px;
      background: var(--panel-2);
      position: relative;
      overflow: hidden;
    }

    .overview-only .metric {
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-color: transparent;
    }

    .overview-only .metric::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 21px;
      height: 3px;
      background: var(--accent);
    }

    .period-summary {
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 14px;
    }

    .period-summary .metric {
      padding: 12px 10px;
      box-shadow: none;
      background: #fbfdff;
    }

    .period-summary .metric strong {
      font-size: clamp(15px, 4.1vw, 20px);
    }

    #entryPeriodSummary {
      grid-template-columns: repeat(2, 1fr);
    }

    body[data-entry-type="income"] #entryPeriodSummary {
      grid-template-columns: repeat(3, 1fr);
    }

    .metric span {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .metric strong {
      display: block;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1;
      overflow-wrap: anywhere;
      color: var(--accent);
      letter-spacing: 0;
    }

    .income-color { color: var(--income) !important; }
    .saved-color { color: var(--saved) !important; }
    .loss-color { color: var(--color-success) !important; }
    .spend-color { color: var(--spend) !important; }
    .muted-color { color: var(--muted) !important; }
    .neutral-color { color: var(--color-ink) !important; }

    .panel {
      padding: 14px;
      margin-bottom: 16px;
      border-color: #dbe6f5;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title h2 {
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .entry-list-header {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line-2);
    }

    .period-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .period-mode, .year-switcher {
      display: grid;
      gap: 3px;
      background: #eef5ff;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #dce9fb;
    }

    .period-mode { grid-template-columns: 1fr 1fr; }

    .year-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn {
      min-height: 36px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 820;
      padding: 0 14px;
    }

    .mode-btn.active, .tab-btn.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 6px 16px rgba(23, 101, 216, 0.12);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--ink);
    }

    .icon-btn:active { background: #fff; }

    #yearLabel {
      min-width: 64px;
      text-align: center;
      font-size: 14px;
      font-weight: 860;
    }

    #entryYearLabel {
      min-width: 64px;
      text-align: center;
      font-size: 14px;
      font-weight: 860;
    }

    .period-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .period-cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      padding: 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .period-cell:not(.is-empty) {
      border-color: #cbdcf0;
    }

    .period-cell .label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.05;
    }

    .mini-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      min-width: 0;
    }

    .mini-row strong {
      font-size: 11px;
      text-align: right;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .period-cell.is-empty {
      background: #ffffff;
      border-color: #e2eaf5;
    }

    .period-cell.is-empty .mini-row strong { color: var(--muted-2) !important; }

    .income-cell-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .income-cell-head strong {
      color: var(--income);
      font-size: 15px;
      line-height: 1.05;
      text-align: right;
      overflow-wrap: anywhere;
      letter-spacing: 0;
    }

    .income-cell-head strong.muted-color {
      color: var(--muted) !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full { grid-column: 1 / -1; }

    .date-row {
      display: block;
    }

    .date-chip {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 850;
      font-size: 16px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .date-chip button {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #eef5ff;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 17px;
      line-height: 1;
    }

    .check-field {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft-2);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .check-field input {
      width: 18px;
      min-height: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--accent);
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .required {
      color: var(--spend);
      margin-left: 3px;
      font-weight: 900;
    }

    input, select, textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 11px 12px;
      outline: none;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 95, 209, 0.13);
    }

    .calculated-value {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      background: var(--soft-2);
      color: var(--muted);
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .primary {
      width: 100%;
      min-height: 50px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 850;
      margin-top: 12px;
      box-shadow: 0 12px 22px rgba(23, 101, 216, 0.22);
    }

    .entry-toggle {
      margin-top: 0;
      min-height: 52px;
    }

    .entry-dropdown {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(16px + var(--safe-bottom));
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .entry-modal {
      width: min(100%, 560px);
      max-height: min(84dvh, 720px);
      overflow-y: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 68px rgba(15, 23, 42, 0.24);
    }

    .secondary {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 8px;
      background: #eef5ff;
      color: var(--accent);
      font-weight: 800;
      border: 1px solid #dce9fb;
    }

    .danger {
      background: #fff3f3;
      color: var(--spend);
      border-color: #f4cbcb;
    }

    .records {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .record-main { min-width: 0; }

    .record-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-bottom: 10px;
    }

    .record-title-row strong {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef5ff;
      color: var(--accent);
      font-size: 12px;
      line-height: 1;
      font-weight: 850;
      white-space: nowrap;
    }

    .record-title-row .record-date {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.2;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .record-meta-grid {
      display: grid;
      gap: 7px;
    }

    .record-meta-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .record-meta-row span:first-child {
      color: var(--muted-2);
      white-space: nowrap;
    }

    .record-meta-row span:last-child {
      color: var(--muted);
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .record-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
      min-width: 88px;
    }

    .amount {
      font-weight: 900;
      font-size: 17px;
      white-space: nowrap;
      line-height: 1.05;
      text-align: right;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      background: #eef5ff;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .mini-actions {
      display: flex;
      gap: 6px;
    }

    .mini-actions button {
      width: 32px;
      height: 30px;
      border-radius: 7px;
      background: #eef5ff;
      color: var(--muted);
      font-weight: 850;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 128px;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 26px 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      line-height: 1.45;
      background: #fbfdff;
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 4px 0 calc(4px + var(--safe-bottom));
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 0;
      border-top: 1px solid rgba(216, 228, 243, 0.92);
      border-radius: 0;
      box-shadow: none;
    }

    .tab-btn {
      min-height: 48px;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
    }

    .tab-btn.active {
      background: transparent;
      color: var(--color-accent);
    }

    .tab-btn svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.3;
    }

    .view { display: none; }
    .view.active { display: block; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(82px + var(--safe-bottom));
      z-index: 20;
      max-width: calc(100% - 32px);
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--ink);
      color: #fff;
      text-align: center;
      font-weight: 800;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .summary { gap: 9px; }

      .metric { padding: 12px 10px; }

      .form-grid, .search-row { grid-template-columns: 1fr; }

      .period-tools {
        width: 100%;
        justify-content: space-between;
      }

      .period-grid { gap: 7px; }

      .period-cell {
        padding: 8px 7px;
      }

      .record-card {
        gap: 10px;
        padding: 12px;
      }

      .record-meta-row {
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 8px;
      }

      .record-side {
        min-width: 74px;
      }

      .amount {
        font-size: 16px;
      }
    }

    /* Hallmark visual pass: app workbench */
    body {
      background: var(--color-paper);
      letter-spacing: 0;
    }

    button {
      transition:
        background-color var(--dur-short) var(--ease-out),
        border-color var(--dur-short) var(--ease-out),
        color var(--dur-short) var(--ease-out),
        opacity var(--dur-short) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    button:active { transform: translateY(1px) scale(0.99); }

    .app {
      max-width: 720px;
      padding: calc(var(--space-lg) + var(--safe-top)) var(--space-md) calc(92px + var(--safe-bottom));
    }

    .view.active {
      animation: viewIn var(--dur-modal) var(--ease-out);
    }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summary {
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .metric,
    .panel,
    .period-cell,
    .record-card {
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }

    .metric {
      border-color: var(--color-rule);
      background: var(--color-surface);
      padding: var(--space-md);
    }

    .overview-only {
      grid-template-columns: 1.18fr 0.82fr;
    }

    .overview-only .metric {
      min-height: 118px;
      padding: var(--space-lg);
      border: 0;
      background: oklch(99% 0.008 255);
    }

    .overview-only .metric::before {
      width: 34px;
      right: auto;
      left: var(--space-lg);
      top: var(--space-md);
      height: 3px;
      border-radius: var(--radius-pill);
      background: var(--color-accent);
    }

    .metric span,
    label {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 720;
      line-height: 1.2;
    }

    .metric strong {
      font-family: var(--font-display);
      font-size: clamp(25px, 7vw, 36px);
      font-weight: 850;
      color: var(--color-accent);
    }

    .overview-only .metric strong {
      font-size: clamp(28px, 8vw, 40px);
    }

    .panel {
      padding: var(--space-md);

      font-weight: 850;
    }

    .period-tools {
      gap: var(--space-sm);
    }

    .period-mode,
    .year-switcher {
      min-height: 44px;
      padding: 3px;
      border: 1px solid var(--color-rule-2);
      background: var(--color-paper-2);
      box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.68);
    }

    .period-mode {
      min-width: 126px;

    .mode-btn {
      min-height: 36px;
      border-radius: 7px;
      font-weight: 850;
      white-space: nowrap;
    }

    .mode-btn.active,
    .tab-btn.active {
      background: var(--color-surface);
      color: var(--color-accent);
      box-shadow: 0 1px 2px oklch(30% 0.04 255 / 0.08);
    }

    .icon-btn {
      color: var(--color-ink);
    }

    .icon-btn:active {
      background: var(--color-surface);
    }

    #yearLabel,
    #entryYearLabel {
      min-width: 64px;
      font-family: var(--font-display);
      font-weight: 850;
    }

    .period-summary {
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .period-summary .metric {
      padding: var(--space-sm);
      border: 1px solid var(--color-rule-2);
      background: var(--color-paper);
      box-shadow: none;
    }

    .period-summary .metric span {
      margin-bottom: var(--space-xs);
    }

    .period-summary .metric strong {
      font-size: clamp(15px, 4vw, 20px);
    }

    .period-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-xs);
    }

    .period-cell {
      min-height: 82px;
      padding: var(--space-sm);
      border: 1px solid var(--color-rule);
      background: var(--color-surface);
      box-shadow: none;

    .period-cell:not(.is-empty) {

    }

    .period-cell .label {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 900;
    }

    .mini-row {
      font-size: 11px;
      color: var(--color-muted);
    }

    .mini-row strong {
      font-size: 11px;
      font-weight: 850;
    }

    .period-cell.is-empty {
      background: oklch(98% 0.008 255);
      border-color: var(--color-rule-2);
    }

    .income-cell-head strong {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;

    .primary {
      min-height: 52px;
      border: 1px solid oklch(42% 0.18 255);

      box-shadow: 0 1px 2px oklch(30% 0.04 255 / 0.12);
      font-weight: 850;
      white-space: nowrap;
    }

    .primary:hover {
      background: oklch(47% 0.19 255);
    }

    .entry-toggle {
      margin-bottom: 0;
    }

    input,
    select,
    textarea,
    .date-chip,
    .calculated-value {
      min-height: 48px;
      border-color: var(--color-rule);
      background: var(--color-surface);
      color: var(--color-ink);
      box-shadow: none;
    }

    textarea {
      min-height: 84px;
      line-height: 1.45;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--color-muted-2);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px oklch(60% 0.18 255 / 0.16);
    }

    .date-chip {
      font-family: var(--font-display);
      font-weight: 850;
    }

    .date-chip button,
    .secondary,

      background: var(--color-paper-2);
      color: var(--color-accent);

    .secondary {

    }

    .danger {
      background: var(--color-danger-soft);
      color: var(--color-danger);

    .entry-dropdown {
      z-index: 400;
      background: var(--color-scrim);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeIn var(--dur-modal) var(--ease-out);
    }

    .entry-modal {
      width: min(100%, 540px);
      padding: var(--space-lg);
      border: 1px solid var(--color-rule);
      background: var(--color-surface);
      box-shadow: 0 16px 40px oklch(20% 0.035 255 / 0.22);
      animation: sheetIn var(--dur-modal) var(--ease-out);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sheetIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .records {
      gap: var(--space-xs);
    }

    .record-card {
      padding: var(--space-md);
      border: 1px solid var(--color-rule);
      background: var(--color-surface);
      box-shadow: none;
    }

      margin-bottom: var(--space-sm);

      color: var(--color-accent);
      font-weight: 850;
    }

    .record-title-row .record-date {
      font-family: var(--font-display);
      font-weight: 850;
      color: var(--color-ink);
    }

    .record-meta-grid {
      gap: var(--space-xs);
    }

    .record-meta-row {
      grid-template-columns: 58px minmax(0, 1fr);
      gap: var(--space-sm);
    }

    .record-meta-row span:first-child {
      color: var(--color-muted-2);
    }

    .record-meta-row span:last-child {
      color: var(--color-muted);
      font-weight: 720;
    }

    .record-side {
      gap: var(--space-sm);
      min-width: 82px;
    }

    .amount {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
    }

    .empty {
      border-color: var(--color-rule);
      background: var(--color-paper);
      color: var(--color-muted);
    }

    .search-row {
      grid-template-columns: minmax(0, 1fr) 118px;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .tabs {
      z-index: 200;
      left: 0;
      right: 0;
      max-width: none;
      padding: 6px 6px calc(6px + var(--safe-bottom));
      border: 1px solid var(--color-rule);
      border-bottom: 0;
      background: oklch(99% 0.006 255 / 0.88);
      box-shadow: 0 -8px 20px oklch(30% 0.04 255 / 0.08);
    }

    .tab-btn {
      min-height: 52px;
      color: var(--color-muted);
      font-weight: 820;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--color-paper-2);
      color: var(--color-accent);
    }

    .tab-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.1;
    }

    .toast {
      z-index: 500;
      background: var(--color-ink);
      color: var(--color-paper);
      transition:
        opacity var(--dur-modal) var(--ease-out),
        transform var(--dur-modal) var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 420px) {
      .app {
        padding-left: var(--space-sm);
        padding-right: var(--space-sm);

        grid-template-columns: 1fr 1fr;
      }

        min-height: 104px;

      }

      .overview-only .metric::before {
        left: var(--space-md);
      }

      .period-tools {
        align-items: stretch;
      }

      .period-mode {
        min-width: 112px;
      }

      .year-switcher {
        flex: 1;

      }

      .period-cell {
        min-height: 76px;

      }

      .record-card {
        grid-template-columns: minmax(0, 1fr);
      }

      .record-side {
        min-width: 0;

        justify-content: space-between;
        align-items: center;

        grid-template-columns: 56px minmax(0, 1fr);

    /* Motion polish: calm transitions for an app-like feel */
    :root {
      --motion-fast: 140ms;
      --motion-base: 220ms;
      --motion-slow: 360ms;
      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --motion-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app {
      animation: appLoad 420ms var(--motion-spring) both;
    }

    .view.active {
      animation: viewSwap 260ms var(--motion-spring) both;
    }

    .view.active > .panel,
    .view.active .overview-only,
    .view.active .entry-toggle {
      animation: panelRise 320ms var(--motion-spring) both;
    }

    .view.active > .panel:nth-of-type(2) {
      animation-delay: 42ms;
    }

    .period-cell,
    .record-card,
    .period-summary .metric {
      transition:
        transform var(--motion-base) var(--motion-ease),
        border-color var(--motion-base) var(--motion-ease),
        background-color var(--motion-base) var(--motion-ease),
        box-shadow var(--motion-base) var(--motion-ease),
        opacity var(--motion-base) var(--motion-ease);
    }

    .period-cell:active,
    .record-card:active {
      transform: translateY(1px) scale(0.992);
    }

    .period-grid .period-cell {
      animation: itemIn 280ms var(--motion-spring) both;
    }

    .period-grid .period-cell:nth-child(2) { animation-delay: 18ms; }
    .period-grid .period-cell:nth-child(3) { animation-delay: 36ms; }
    .period-grid .period-cell:nth-child(4) { animation-delay: 54ms; }
    .period-grid .period-cell:nth-child(5) { animation-delay: 72ms; }
    .period-grid .period-cell:nth-child(6) { animation-delay: 90ms; }
    .period-grid .period-cell:nth-child(7) { animation-delay: 108ms; }
    .period-grid .period-cell:nth-child(8) { animation-delay: 126ms; }
    .period-grid .period-cell:nth-child(9) { animation-delay: 144ms; }
    .period-grid .period-cell:nth-child(10) { animation-delay: 162ms; }
    .period-grid .period-cell:nth-child(11) { animation-delay: 180ms; }
    .period-grid .period-cell:nth-child(12) { animation-delay: 198ms; }

    .records .record-card {
      animation: itemIn 240ms var(--motion-spring) both;
    }

    .records .record-card:nth-child(2) { animation-delay: 18ms; }
    .records .record-card:nth-child(3) { animation-delay: 36ms; }
    .records .record-card:nth-child(4) { animation-delay: 54ms; }
    .records .record-card:nth-child(5) { animation-delay: 72ms; }

    .entry-dropdown {
      animation: overlayIn 220ms var(--motion-ease) both;
      width: 100vw;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
    }

    .entry-modal {
      max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 32px);
      overflow: hidden !important;
      animation: sheetRise 360ms var(--motion-spring) both;
      will-change: transform, opacity;
      touch-action: auto;
    }

    .picker-layer {
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
    }

    .picker-layer {
      animation: overlayIn 200ms var(--motion-ease) both;
    }

    .picker-sheet {
      animation: sheetRise 320ms var(--motion-spring) both;
      will-change: transform, opacity;
    }

    .picker-item,
    .picker-add,
    .picker-add-form {
      animation: itemIn 220ms var(--motion-spring) both;
    }

    .tab-btn {
      transition:
        transform var(--motion-base) var(--motion-spring),
        background-color var(--motion-base) var(--motion-ease),
        color var(--motion-base) var(--motion-ease),
        width var(--motion-base) var(--motion-spring),
        box-shadow var(--motion-base) var(--motion-ease);
    }

    .tab-btn.active {
      animation: tabPop 260ms var(--motion-spring) both;
    }

    .toast.show {
      animation: toastIn 260ms var(--motion-spring) both;
    }

    @keyframes appLoad {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes viewSwap {
      from { opacity: 0; transform: translateY(8px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes panelRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sheetRise {
      from { opacity: 0; transform: translateY(26px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes tabPop {
      0% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Type scale normalization */
    body {
      font-size: 14px;
      line-height: 1.45;
    }

    .overview-hero-copy span,
    .metric span,
    .period-summary .metric span,
    label,
    .picker-title,
    .record-meta-label,
    .period-cell .label,
    .period-cell .line span:first-child {
      font-size: 12px !important;
      line-height: 1.35;
      font-weight: 680 !important;
    }

    .overview-hero-copy h1 {
      font-size: clamp(22px, 5.3vw, 28px) !important;
      font-weight: 780;
    }

    .overview-hero-copy p {
      font-size: 12px !important;
      line-height: 1.42;
    }

    .panel-title h2,
    .entry-modal h2,
    .detail-header h2,
    .record-title-row strong {
      font-size: 16px !important;
      line-height: 1.25;
      font-weight: 780 !important;
    }

    .overview-only .metric.asset-total-metric span,
    .overview-only .asset-profit-metric span {
      margin-bottom: 16px;
      font-size: 12px !important;
      font-weight: 680 !important;
    }

    .overview-only .metric.asset-total-metric strong,
    .overview-only .metric.asset-total-metric strong.saved-color {
      font-size: clamp(24px, 6.4vw, 32px) !important;
      font-weight: 760 !important;
      letter-spacing: 0;
    }

    .overview-only .asset-profit-metric strong {
      font-size: clamp(24px, 6.4vw, 32px) !important;
      font-weight: 760 !important;
      letter-spacing: 0;
    }

    .summary:not(.overview-only) .metric strong,
    .period-summary .metric strong,
    #entryPeriodSummary .metric strong {
      font-size: clamp(12px, 4.5vw, 24px) !important;
      line-height: 1.12;
      font-weight: 760 !important;
      letter-spacing: 0;
    }

    .period-cell h3,
    .period-cell .period-title {
      font-size: 20px !important;
      line-height: 1.2;
      font-weight: 780 !important;
    }

    .period-cell .amount,
    .period-cell .line strong,
    .period-cell strong {
      font-size: 12px !important;
      line-height: 1.25;
      font-weight: 700 !important;
      letter-spacing: 0;
    }

    .period-cell .mini-row {
      font-weight: 400 !important;
    }

    .records,
    .record-card,
    .record-meta-grid,
    .empty {
      font-size: 14px;
      line-height: 1.4;
    }

    .record-amount,
    .record-title-row .amount,
    .record-card strong[data-amount] {
      font-size: 16px !important;
      line-height: 1.18;
      font-weight: 760 !important;
    }

    input,
    textarea,
    select,
    .picker-trigger,
    .calculated-value {
      font-size: 14px !important;
      line-height: 1.3;
      font-weight: 520 !important;
    }

    input::placeholder,
    textarea::placeholder,
    .picker-trigger.is-placeholder {
      font-size: 14px !important;
      font-weight: 400 !important;
    }

    button,
    .primary,
    .secondary,
    .overview-action,
    .entry-toggle,
    .detail-actions .primary,
    .picker-name,
    .picker-add,
    .tab-btn {
      font-size: 14px !important;
      line-height: 1.2;
      font-weight: 700 !important;
      letter-spacing: 0;
    }

    .mode-btn,
    #overviewYearLabel,
    #entryYearLabel,
    .year-switcher {
      font-size: 15px !important;
      font-weight: 740 !important;
    }

    .tab-btn span {
      font-size: 12px !important;
      font-weight: 700 !important;
    }

    /* Alipay wealth style refresh */
    :root {
      --color-paper: #f5f7fb;
      --color-paper-2: #eef4ff;
      --color-surface: #ffffff;
      --color-surface-2: #f7faff;
      --color-ink: #1f2329;
      --color-muted: #697386;
      --color-muted-2: #a2aabc;
      --color-rule: #e8edf5;
      --color-rule-2: #f1f4f8;
      --color-accent: #009bff;
      --color-accent-2: #4d9cff;
      --color-focus: #009bff;
      --color-success: #16a46b;
      --color-danger: #e94b5f;
      --color-danger-soft: #fff0f3;
      --bg: var(--color-paper);
      --panel: var(--color-surface);
      --panel-2: var(--color-surface-2);
      --ink: var(--color-ink);
      --muted: var(--color-muted);
      --muted-2: var(--color-muted-2);
      --line: var(--color-rule);
      --line-2: var(--color-rule-2);
      --accent: var(--color-accent);
      --accent-2: var(--color-accent-2);
      --soft: #eaf3ff;
      --soft-2: #f7fbff;
      --income: #009bff;
      --saved: #1f2329;
      --spend: #e94b5f;
      --shadow: 0 8px 24px rgba(31, 63, 113, 0.06);
      --shadow-soft: 0 10px 28px rgba(31, 63, 113, 0.07);
    }

    body {
      background: #f5f7fb;
      color: var(--color-ink);
    }

    .app {
      padding-top: calc(26px + var(--safe-top));
    }

    .panel,
    .metric,
    .period-cell,
    .record-card,
    .entry-modal,
    .picker-sheet {
      border-color: var(--color-rule);
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(31, 63, 113, 0.05);
    }

    .overview-only {
      gap: 12px;
      padding: 18px;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      color: var(--color-ink);
      box-shadow: 0 14px 34px rgba(31, 63, 113, 0.10);
    }

    .overview-hero-copy {
      padding-bottom: 2px;
    }

    .overview-hero-copy span {
      color: #009bff !important;
      font-weight: 760 !important;
    }

    .overview-hero-copy h1 {
      color: var(--color-ink);
    }

    .overview-hero-copy p {
      color: var(--color-muted);
    }

    .overview-only .metric.asset-total-metric,
    .overview-only .metric:first-of-type.asset-total-metric,
    .overview-only .asset-profit-metric {
      min-height: 96px;
      padding: 14px;
      border: 1px solid #dcecff;
      border-radius: 16px;
      background: #f4f9ff;
      box-shadow: none;
    }

    .overview-only .metric.asset-total-metric,
    .overview-only .metric:first-of-type.asset-total-metric {
      grid-column: 1 / -1;
      width: 100%;
      min-width: 0;
    }

    .overview-only .asset-profit-metric {
      border-color: #edf1f7;
      background: #fbfcff;
    }

    .overview-only .metric.asset-total-metric span,
    .overview-only .asset-profit-metric span {
      color: var(--color-muted) !important;
    }

    .overview-only .metric.asset-total-metric strong,
    .overview-only .metric.asset-total-metric strong.saved-color,
    .overview-only .asset-profit-metric strong {
      color: var(--color-ink) !important;
    }

    .overview-only .asset-profit-metric strong.loss-color,
    .loss-color {
      color: #16a46b !important;
    }

    .overview-only .asset-profit-metric strong.spend-color,
    .spend-color {
      color: #e94b5f !important;
    }

    .overview-only .asset-profit-metric strong.muted-color,
    .muted-color {
      color: var(--color-muted-2) !important;
    }

    .neutral-color {
      color: var(--color-ink) !important;
    }

    .overview-actions {
      gap: 10px;
    }

    .overview-action,
    .entry-toggle,
    .detail-actions .primary,
    .settings-add .secondary,
    .picker-save {
      background: #009bff !important;
      color: #ffffff !important;
      box-shadow: 0 10px 22px rgba(22, 119, 255, 0.22) !important;
    }

    .overview-action.income-action {
      background: #eaf3ff !important;
      color: #009bff !important;
      box-shadow: none !important;
    }

    .period-mode,
    .year-switcher {
      background: rgba(255, 255, 255, 0.92);
      border-color: #edf1f7;
      box-shadow: 0 10px 26px rgba(31, 63, 113, 0.06);
    }

    .mode-btn.active {
      background: #009bff !important;
      color: #ffffff !important;
      box-shadow: 0 10px 22px rgba(22, 119, 255, 0.22);
    }

    .icon-btn,
    .secondary,
    .picker-cancel,
    .mini-actions button {
      background: #f5f8fd !important;
      color: #697386 !important;
      border-color: #e8edf5 !important;
      box-shadow: none !important;
    }

    .period-summary .metric:nth-child(4n + 1),
    #entryPeriodSummary .metric:nth-child(3n + 1) {
      background: #fff9ed !important;
    }

    .period-summary .metric:nth-child(4n + 2),
    #entryPeriodSummary .metric:nth-child(3n + 2),
    body[data-entry-type="saved"] #entryPeriodSummary .metric:nth-child(2n + 1) {
      background: #eef6ff !important;
    }

    .period-summary .metric:nth-child(4n + 3),
    #entryPeriodSummary .metric:nth-child(3n + 3),
    body[data-entry-type="saved"] #entryPeriodSummary .metric:nth-child(2n + 2) {
      background: #eefaf5 !important;
    }

    .period-summary .metric:nth-child(4n + 4) {
      background: #fff1f4 !important;
    }

    #viewOverview .overview-period-summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #viewOverview .overview-period-summary .period-spend-metric {
      display: none;
    }

    #viewOverview .overview-period-summary .metric:first-child {
      grid-column: 1;
      grid-row: 1;
    }

    #viewOverview .overview-period-summary .metric:nth-child(3) {
      grid-column: 2;
      grid-row: 1;
    }

    #viewOverview .overview-period-summary .period-allocation-metric {
      display: grid;
      grid-column: 1 / -1;
      grid-row: 2;
      gap: 0;
      background: #f6f8fc !important;
    }

    #viewOverview .overview-period-summary .metric:first-child,
    #viewOverview .overview-period-summary .metric:nth-child(3) {
      background: #f6f8fc !important;
    }

    #viewOverview .overview-period-summary .metric:first-child,
    #viewOverview .overview-period-summary .metric:nth-child(3),
    #viewOverview .overview-period-summary .period-allocation-metric {
      background: transparent !important;
      border: 0 !important;
      border-radius: 0;
      box-shadow: none !important;
    }

    #viewOverview .overview-period-summary .metric:first-child {
      border-right: 1px solid #e8edf5 !important;
    }

    #viewOverview .overview-period-summary .period-allocation-metric {
      border-top: 1px solid #e8edf5 !important;
    }

    #viewOverview .overview-period-summary .period-allocation-metric > span {
      display: none;
    }

    .summary-allocation {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 0;
    }

    .summary-allocation-values {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      min-width: 0;
    }

    .summary-allocation-value {
      display: grid;
      gap: 0;
      min-width: 0;
    }

    .summary-allocation-value.saved {
      text-align: right;
    }

    .summary-allocation-value span {
      min-width: 0;
      color: var(--color-ink);
      font-size: 12px;
      font-weight: 760;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-allocation-value strong {
      min-width: 0;
      font-size: clamp(18px, 4vw, 24px) !important;
      font-weight: 760 !important;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .summary-allocation-value.spend strong:not(.muted-color) {
      color: #64b5f6 !important;
    }

    .summary-allocation-value.saved strong:not(.muted-color) {
      color: #93dccd !important;
    }

    .summary-allocation-bar {
      display: flex;
      height: 12px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      border-radius: 999px;
      background: #e8edf5;
    }

    .summary-allocation-bar span {
      display: block;
      min-width: 0;
      height: 100%;
    }

    .summary-allocation-spend {
      flex: 0 0 var(--spend-share, 50%);
      background: #64b5f6;
      border-radius: 999px 0 0 999px;
    }

    .summary-allocation-saved {
      flex: 1 1 auto;
      background: #93dccd;
      border-radius: 0 999px 999px 0;
    }

    .summary-allocation.is-empty .summary-allocation-spend,
    .summary-allocation.is-empty .summary-allocation-saved {
      background: #dfe6f2;
    }

    /* The weight view is an open calendar surface rather than a white dashboard card. */
    .weight-page-panel {
      position: relative;
      min-height: 520px;
      padding: 14px 0 20px;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .weight-page-panel .weight-grid:not([hidden]),
    .weight-page-panel .weight-bar-chart:not([hidden]) {
      display: grid;
      visibility: visible;
      opacity: 1;
    }

    .weight-page-panel .weight-bar-chart:not([hidden]) {
      display: block;
    }

    .weight-page-panel > .panel-title {
      margin-bottom: 18px;
      padding: 0 2px;
    }

    .weight-page-panel > .panel-title h2 {
      font-size: 20px;
      letter-spacing: 0;
    }

    .weight-page-panel .weight-toolbar {
      gap: 16px;
    }

    .weight-page-panel .weight-person-tabs,
    .weight-page-panel .weight-period-mode {
      border: 0;
      background: #e9eaf2;
      box-shadow: none;
    }

    .weight-page-panel .weight-period-mode {
      display: inline-grid;
      grid-template-columns: repeat(2, max-content);
      width: fit-content !important;
      min-width: 0 !important;
      max-width: 100%;
      justify-self: end;
      padding: 3px;
    }

    .weight-page-panel .weight-person-tabs {
      display: grid;
      grid-template-columns: repeat(var(--weight-person-count, 2), 36px);
      grid-auto-flow: row;
      grid-auto-columns: unset;
      width: max-content !important;
      min-width: 0 !important;
      max-width: 100%;
      justify-content: start;
      justify-self: start !important;
      align-self: start;
      gap: 3px;
      padding: 3px;
    }

    .weight-page-panel .weight-person-tabs .mode-btn {
      width: 36px;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
    }

    .weight-page-panel .weight-person-tabs .mode-btn,
    .weight-page-panel .weight-period-mode .mode-btn {
      width: 36px;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      color: #7a7e8d;
    }

    .weight-page-panel .weight-person-tabs .mode-btn.active,
    .weight-page-panel .weight-period-mode .mode-btn.active {
      background: #ffffff;
      color: #17191f;
      box-shadow: 0 2px 8px rgba(38, 42, 56, 0.08);
    }

    .weight-page-panel .year-switcher {
      border: 0;
      width: fit-content;
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      margin-bottom: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(35, 46, 72, 0.08);
    }

    .weight-page-panel .weight-toolbar > .year-switcher {
      width: fit-content !important;
      min-width: 0 !important;
      flex: 0 0 auto;
    }

    .weight-page-panel .weight-grid {
      gap: 8px;
      margin-top: 4px;
    }

    .weight-page-panel .weight-weekday {
      color: #8b8f9b;
      padding-bottom: 2px;
      font-weight: 600;
    }

    .weight-page-panel .weight-cell,
    .weight-page-panel .weight-grid.is-day-calendar .weight-cell,
    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-empty {
      aspect-ratio: 1 / 1;
      min-height: 0;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: none;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-empty {
      visibility: visible;
      background: transparent;
    }

    .weight-page-panel .weight-cell.is-current {
      border: 0;
      background: #ffffff;
      color: #17191f;
    }

    .weight-page-panel .weight-cell.is-up {
      background: #fff0f1;
    }

    .weight-page-panel .weight-cell.is-down {
      background: #eef8f1;
    }

    .weight-page-panel .weight-cell.is-current.is-up {
      background: #ffffff;
    }

    .weight-page-panel .weight-cell.is-current.is-down {
      background: #ffffff;
    }

    .weight-page-panel .weight-cell.is-future .weight-cell-title,
    .weight-page-panel .weight-cell.is-future .weight-value,
    .weight-page-panel .weight-cell.is-future .weight-delta {
      color: #b8bbc4;
    }

    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current .weight-cell-title,
    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current .weight-value,
    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current .weight-delta {
      color: #17191f;
    }

    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current.is-up .weight-value,
    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current.is-up .weight-delta {
      color: #d94853;
    }

    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current.is-down .weight-value,
    .weight-page-panel .weight-grid:not(.is-day-calendar) .weight-cell.is-current.is-down .weight-delta {
      color: #2fa66a;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell {
      position: relative;
      display: block;
      padding: 7px;
      text-align: left;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-day {
      display: block;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell .weight-cell-title {
      position: absolute;
      top: 7px;
      right: 7px;
      color: #343944;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      text-align: right;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-future .weight-cell-title {
      color: #b8bbc4;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell .weight-value {
      position: absolute;
      left: 7px;
      bottom: 7px;
      max-width: calc(100% - 14px);
      color: #7f8490;
      font-size: 11px;
      font-weight: 680;
      line-height: 1;
      text-align: left;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-up .weight-value {
      color: #d94853;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-down .weight-value {
      color: #2fa66a;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-current .weight-cell-title {
      color: #17191f;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-no-data .weight-value {
      visibility: hidden;
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-current {
      border: 2px solid #009bff !important;
      background: #ffffff !important;
      box-shadow: 0 0 0 1px rgba(0, 155, 255, 0.12);
    }

    .weight-page-panel .weight-grid.is-day-calendar .weight-cell.is-current .weight-cell-title {
      color: #1f2329 !important;
    }

    @media (max-width: 430px) {
      #viewOverview .overview-period-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .period-cell {
      background: #ffffff;
      border-color: #e9eef7;
      box-shadow: none;
    }

    .period-cell.is-current-month {
      border-color: #009bff;
      background: #f4f9ff;
      box-shadow: none;
    }

    .period-cell h3,
    .period-cell .period-title {
      color: var(--color-ink);
    }

    .record-card.income-entry {
      background: #fffaf0;
      border-color: #f3e7c8;
    }

    .record-card.saved-entry {
      background: #f5f9ff;
      border-color: #dfeeff;
    }

    input,
    textarea,
    select,
    .picker-trigger,
    .calculated-value {
      border-color: #e4eaf3;
      background: #ffffff;
    }

    input:focus,
    textarea:focus,
    select:focus,
    .picker-trigger:focus-visible {
      border-color: #009bff;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
      outline: none;
    }

    .picker-item.active {
      background: #edf5ff;
    }

    .picker-add {
      color: #009bff !important;
    }

    .tabs .tab-btn {
      justify-content: center;
    }

    /* Bottom navigation: plain app tab bar */
    .tabs {
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      max-width: none !important;
      height: auto !important;
      transform: none !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 0 !important;
      padding: 4px 0 calc(4px + var(--safe-bottom)) !important;
      border: 0 !important;
      border-top: 1px solid #e6edf6 !important;
      border-radius: 0 !important;
      background: rgba(255, 255, 255, 0.98) !important;
      box-shadow: none !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .tabs .tab-btn {
      width: 100% !important;
      min-height: 48px !important;
      height: 48px !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #8a93a6 !important;
      box-shadow: none !important;
    }

    .tabs .tab-btn.active {
      background: transparent !important;
      color: #009bff !important;
      box-shadow: none !important;
      animation: none !important;
    }

    .tabs .tab-btn svg {
      width: 20px !important;
      height: 20px !important;
      stroke-width: 2 !important;
    }

    .overview-detail-panel {
      margin-top: 14px;
      padding-top: 16px;
    }

    .overview-detail-panel .panel-title {
      margin-bottom: 12px;
    }

    .overview-detail-title {
      align-items: flex-start;
    }

    .overview-detail-tabs {
      width: min(210px, 100%);
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .overview-detail-filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .detail-filter-field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .detail-filter-field[hidden] {
      display: none;
    }

    .detail-filter-field span {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
    }

    .detail-filter-field select {
      min-height: 40px;
      padding: 0 10px;
      border-radius: 12px;
      font-size: 14px;
      background: #fff;
    }

    .weight-toolbar {
      display: grid;
      gap: 12px;
    }

    .weight-toolbar-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: end;
    }

    .weight-toolbar-row .period-mode {
      width: 100%;
    }

    .weight-person-field {
      display: grid;
      gap: 5px;
    }

    .weight-person-field span {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .weight-person-tabs {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: 34px;
      grid-template-columns: none;
      justify-content: start;
      justify-self: start;
      width: auto !important;
      gap: 3px;
      padding: 3px;
      border: 1px solid #e8e0fb;
      border-radius: 999px;
      background: #f7f4ff;
    }

    .weight-person-tabs .mode-btn {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 999px;
      background: transparent;
      color: #7d748c;
      font-size: 13px;
      font-weight: 720;
    }

    .weight-person-tabs .mode-btn.active {
      background: var(--color-accent);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(123, 92, 246, 0.22);
    }

    .weight-period-mode {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      justify-self: end;
      width: min(100%, 150px) !important;
      padding: 3px;
      border-radius: 999px;
    }

    .weight-period-mode .mode-btn {
      min-height: 30px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 13px;
    }

    .weight-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: center;
    }

    .weight-actions .primary {
      min-height: 42px;
      border-radius: 999px;
      padding: 0 16px;
      font-size: 14px;
    }

    .weight-toolbar > .year-switcher {
      justify-self: center;
      width: fit-content;
      min-width: 220px;
    }

    .weight-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .weight-grid.is-day-calendar {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weight-weekday {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      line-height: 1;
      padding: 0 0 4px;
    }

    .weight-cell {
      display: grid;
      gap: 6px;
      min-height: 94px;
      padding: 12px;
      border: 1px solid #edf0f6;
      border-radius: 12px;
      background: #fff;
      text-align: left;
    }

    .weight-grid.is-day-calendar .weight-cell {
      position: relative;
      gap: 4px;
      min-height: 72px;
      padding: 8px 6px;
      text-align: center;
    }

    .weight-grid.is-day-calendar .weight-cell.is-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .weight-grid.is-day-calendar .weight-cell.is-empty {
      visibility: hidden;
      min-height: 72px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .weight-cell.is-current {
      border-color: #009bff;
      background: #009bff;
      color: #ffffff;
    }

    .weight-cell.is-up {
      border-color: #ffd6d8;
      background: #fff1f3;
    }

    .weight-cell.is-down {
      border-color: #cdeedc;
      background: #effaf4;
    }

    .weight-cell.is-current.is-up {
      border-color: #d94853;
      background: #d94853;
    }

    .weight-cell.is-current.is-down {
      border-color: #2fa66a;
      background: #2fa66a;
    }

    .weight-cell.is-current .weight-cell-title,
    .weight-cell.is-current .weight-value,
    .weight-cell.is-current .weight-delta,
    .weight-cell.is-current.is-up .weight-value,
    .weight-cell.is-current.is-down .weight-value {
      color: #ffffff;
    }

    .weight-cell .weight-cell-title {
      color: var(--color-ink);
      font-size: 18px;
      font-weight: 780;
      line-height: 1.1;
    }

    .weight-grid.is-day-calendar .weight-cell .weight-cell-title {
      position: static;
      transform: none;
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
    }

    .weight-grid.is-day-calendar .weight-cell.is-current .weight-cell-title {
      color: #ffffff;
    }

    .weight-cell .weight-value {
      color: var(--color-ink);
      font-size: 16px;
      font-weight: 760;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      white-space: nowrap;
    }

    .weight-grid.is-day-calendar .weight-cell .weight-value {
      position: static;
      transform: none;
      max-width: calc(100% - 8px);
      font-size: 10px;
      font-weight: 680;
      line-height: 1;
      overflow: hidden;
      text-align: center;
    }

    .weight-cell.is-up .weight-value {
      color: var(--color-danger);
    }

    .weight-cell.is-down .weight-value {
      color: var(--color-success);
    }

    .weight-cell .weight-delta {
      color: var(--color-muted-2);
      font-size: 12px;
      font-weight: 700;
    }

    .weight-grid.is-day-calendar .weight-cell .weight-delta {
      display: none;
    }

    .weight-cell .weight-delta.up {
      color: var(--color-danger);
    }

    .weight-cell .weight-delta.down {
      color: var(--color-success);
    }

    .weight-bar-chart {
      margin-top: 18px;
      padding: 14px 0 2px;
      border-top: 1px solid rgba(139, 143, 155, 0.16);
    }

    .weight-bar-chart-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .weight-bar-chart-header h3 {
      margin: 0;
      color: #343944;
      font-size: 15px;
      font-weight: 700;
    }

    .weight-bar-chart-header span {
      color: #9a9eaa;
      font-size: 12px;
    }

    .weight-selected-tip {
      position: absolute;
      top: -48px;
      left: 50%;
      z-index: 2;
      display: grid;
      gap: 3px;
      min-width: 76px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #2c2d31;
      color: #ffffff;
      transform: translateX(-50%);
      text-align: right;
      white-space: nowrap;
    }

    .weight-selected-tip::after {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 0;
      height: var(--tip-line-height, 82px);
      border-left: 1px dashed rgba(44, 45, 49, 0.58);
      content: "";
      transform: translateX(-50%);
    }

    .weight-bar-item.is-edge-start .weight-selected-tip {
      left: 0;
      transform: none;
    }

    .weight-bar-item.is-edge-start .weight-selected-tip::after {
      left: 5px;
      transform: none;
    }

    .weight-bar-item.is-edge-end .weight-selected-tip {
      right: 0;
      left: auto;
      transform: none;
    }

    .weight-bar-item.is-edge-end .weight-selected-tip::after {
      right: 5px;
      left: auto;
      transform: none;
    }

    .weight-selected-tip span {
      color: #ffffff;
      font-size: 11px;
    }

    .weight-selected-tip strong {
      color: #bfc3ca;
      font-size: 14px;
      line-height: 1;
    }

    .weight-selected-tip.is-up strong {
      color: #ef747b;
    }

    .weight-selected-tip.is-down strong {
      color: #62c18a;
    }

    .weight-selected-tip.is-empty strong {
      color: #c4c7cf;
    }

    .weight-bars {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 146px;
      padding: 0 2px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }

    .weight-bars.is-daily {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0;
      width: 100%;
      padding-top: 52px;
      overflow: visible;
      overflow-y: hidden;
    }

    .weight-bars.is-daily .weight-bar-item {
      flex: 0 1 9px;
      min-height: 146px;
      gap: 5px;
    }

    .weight-bars.is-daily .weight-bar-value {
      display: none;
    }

    .weight-bars.is-daily .weight-bar {
      width: 6px;
    }

    .weight-bars.is-daily .weight-bar-label {
      font-size: 8px;
    }

    .weight-bars.is-monthly {
      justify-content: space-between;
      gap: 0;
      width: 100%;
      padding-top: 52px;
      overflow: visible;
    }

    .weight-bars.is-monthly .weight-bar-item {
      flex: 0 1 26px;
      min-width: 0;
    }

    .weight-bar-item {
      position: relative;
      display: flex;
      flex: 0 0 26px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      min-height: 146px;
    }

    .weight-bar-value {
      min-height: 14px;
      color: #7f8490;
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .weight-bar {
      width: 18px;
      height: var(--bar-height, 8px);
      min-height: 4px;
      border-radius: 6px 6px 3px 3px;
      background: #cfd3dc;
    }

    .weight-bar-item[data-weight-bar-date] {
      cursor: pointer;
    }

    .weight-bar-item.is-selected .weight-bar {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px #009bff;
    }

    .weight-bar-item.is-up .weight-bar {
      background: #e36a73;
    }

    .weight-bar-item.is-down .weight-bar {
      background: #55b383;
    }

    .weight-bars.is-daily .weight-bar-item.is-up .weight-bar {
      background: #fec5bb;
    }

    .weight-bars.is-daily .weight-bar-item.is-down .weight-bar {
      background: #99d98c;
    }

    .weight-bars.is-daily .weight-selected-tip.is-up strong {
      color: #fec5bb;
    }

    .weight-bars.is-daily .weight-selected-tip.is-down strong {
      color: #99d98c;
    }

    .weight-bar-item.is-empty .weight-bar {
      min-height: 4px;
      background: rgba(207, 211, 220, 0.38);
    }

    .weight-bar-label {
      color: #8b8f9b;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
    }

    .weight-dropdown {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(16px + var(--safe-bottom));
      background: rgba(23, 24, 28, 0.34);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .weight-dropdown[hidden] {
      display: none;
    }

    .weight-modal {
      width: min(100%, 520px);
      padding: 20px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 58px rgba(61, 49, 84, 0.18);
    }

    @media (max-width: 430px) {
      .overview-detail-filters,
      .weight-actions {
        grid-template-columns: 1fr;
      }

      .weight-toolbar-row {
        grid-template-columns: auto minmax(126px, 150px);
        align-items: end;
      }

      .weight-period-mode {
        width: 100% !important;
      }

      .weight-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .weight-page-panel .weight-grid:not(.is-day-calendar) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .weight-grid.is-day-calendar {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }

      .weight-grid.is-day-calendar .weight-cell,
      .weight-grid.is-day-calendar .weight-cell.is-empty {
        aspect-ratio: 1 / 1;
        min-height: 0;
      }

      .weight-grid.is-day-calendar .weight-cell {
        gap: 2px;
        padding: 4px 2px;
      }
    }

    @media (max-width: 430px) {
      .overview-detail-filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Redesigned income / saved record cards */
    .records {
      display: grid;
      gap: 10px;

    .record-card {

      padding: 14px 14px 14px 16px;
      border: 1px solid #e8edf5;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(31, 63, 113, 0.045);

    .record-card.income-entry .record-title-row strong {

    .record-title-row .record-date {

    .record-meta-grid {

    .record-meta-row span:first-child {

    .record-meta-row span:last-child {

    .record-side {

    .record-side .amount {

    .record-side .amount.income-color {

    .record-side .amount.saved-color {

    .mini-actions {

      box-shadow: 0 4px 10px rgba(31, 63, 113, 0.05) !important;

      gap: 8px;
      align-items: center;

      grid-column: 1 / -1; width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid #e3eaf4;
      border-radius: 10px; background: #fff; color: var(--color-ink); font-size: 14px;

    .checkin-color-picker { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }

      flex: 0 0 12px; width: 12px !important; min-width: 12px; height: 12px !important; min-height: 12px; padding: 0 !important; border: 2px solid transparent; border-radius: 3px;
      background: var(--swatch-color); box-shadow: inset 0 0 0 1px rgba(31, 41, 55, 0.08);

    .checkin-color-swatch.is-selected { border-color: var(--color-ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--color-ink); }
    .checkin-add-form .checkin-color-swatch {
      flex: 0 0 12px !important; width: 12px !important; min-width: 12px !important;
      height: 12px !important; min-height: 12px !important; max-height: 12px !important;
      aspect-ratio: 1 / 1 !important; align-self: flex-start;
    }
    .checkin-add-form button {
      min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px;
      background: var(--color-accent); color: #fff; font-size: 13px; font-weight: 700;
    }
    .checkin-add-form button[type="button"] { background: #eef2f7; color: var(--color-muted); }
    .checkin-period {
      display: inline-grid; grid-template-columns: repeat(3, minmax(44px, 1fr)); gap: 3px;
      padding: 3px; border-radius: 999px; background: #e8edf5;
    }
    .checkin-period button {
      min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px;
      background: transparent; color: var(--color-muted); font-size: 13px; font-weight: 700;
    }
    .checkin-period button.active { background: #fff; color: var(--color-accent); box-shadow: 0 3px 8px rgba(31, 63, 113, 0.1); }
    .checkin-range { display: inline-flex; align-items: center; gap: 8px; color: var(--color-ink); font-size: 14px; font-weight: 700; }
    .checkin-range-label { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; white-space: nowrap; }
    .checkin-time-picker { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    .checkin-range button {
      width: 30px; height: 30px; padding: 0; border: 0; border-radius: 999px;
      background: #fff; color: var(--color-muted); box-shadow: 0 4px 10px rgba(31, 63, 113, 0.07);
    }
    .checkin-range .checkin-range-label { width: auto; min-width: max-content; height: auto; padding: 0; border-radius: 0; background: transparent; box-shadow: none; color: var(--color-ink); }
    .checkin-card {
      display: grid; gap: 8px; padding: 8px 0; border: 0; border-radius: 0;
      background: transparent; box-shadow: none;
    }
    .checkin-card.is-week { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; }
    .checkin-card.is-week .checkin-card-head { grid-column: 1; align-self: center; }
    .checkin-card.is-week .checkin-delete { display: none; }
    .checkin-card.is-week .checkin-name { font-size: 14px; }
    .checkin-card.is-week .checkin-days { grid-column: 2; grid-row: 1; grid-template-columns: repeat(7, 24px); gap: 8px; }
    .checkin-card.is-week .checkin-weekdays { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(7, 24px); gap: 8px; }
    .checkin-card.is-week .checkin-weekday { font-size: 10px; line-height: 12px; }
    .checkin-global-weekdays { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 0; }
    .checkin-global-weekdays .checkin-weekdays { display: grid; grid-column: 2; grid-template-columns: repeat(7, 24px); gap: 8px; }
    .checkin-card.is-week .checkin-weekday { font-size: 9px; line-height: 12px; }
    .checkin-card.is-week .checkin-day { width: 24px; height: 24px; border-radius: 8px; font-size: 10px !important; font-weight: 400 !important; line-height: 1 !important; letter-spacing: 0; }
    .checkin-card.is-week .checkin-day.is-today { outline-width: 2px; outline-offset: 1px; outline-color: var(--checkin-color); }
    .checkin-card.is-week .checkin-day.is-empty { display: block; visibility: hidden; }
    .checkin-card.is-month { position: relative; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 12px; padding: 12px; border-radius: 16px; background: #fff; }
    .checkin-card.is-month .checkin-card-head { grid-column: 1; grid-row: 1; }
    .checkin-card.is-month .checkin-stats { position: absolute; top: 48px; left: 0; grid-column: 1; grid-row: auto; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; }
    .checkin-card.is-month .checkin-delete { position: absolute; left: 12px; bottom: 12px; }
    .checkin-card.is-month .checkin-days { grid-column: 2; grid-row: 1 / span 2; grid-template-columns: repeat(7, 24px); justify-content: end; gap: 6px; }
    .checkin-card.is-month .checkin-day { width: 24px; height: 24px; border-radius: 8px; font-size: 10px !important; font-weight: 400 !important; }
    .checkin-card.is-year { gap: 12px; padding: 12px; border-radius: 16px; background: #fff; }
    .checkin-card-head { align-items: flex-start; }
    .checkin-name { display: flex; align-items: center; min-width: 0; gap: 8px; color: var(--color-ink); font-size: 17px; font-weight: 780; }
    .checkin-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .checkin-delete { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 999px; background: #f5f8fd; color: #a2aabc; }
    .checkin-stats { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--color-muted); font-size: 12px; font-weight: 650; }
    .checkin-stats strong { color: var(--checkin-color, var(--color-accent)); font-size: 15px; }
    .checkin-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
    .checkin-weekday { color: var(--color-muted-2); font-size: 11px; text-align: center; }
    .checkin-day { aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 16px; background: #eef2f7; color: var(--color-muted-2); font-size: 11px; font-weight: 700; }
    .checkin-day.is-complete { background: var(--checkin-color, #009bff); color: #fff; }
    .checkin-day.is-today { outline: 2px solid var(--checkin-color, var(--color-accent)); outline-offset: 2px; }
    .checkin-day.is-future { opacity: 0.42; }
    .checkin-day.is-empty { visibility: hidden; }
    .checkin-year-grid { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-auto-flow: row; gap: 4px 0; }
    .checkin-year-dot { justify-self: center; width: 12px; height: 12px; border-radius: 2px; background: #eef2f7; }
    .checkin-year-dot.is-complete { background: var(--checkin-color, #009bff); }
    .checkin-year-dot.is-today { outline: 1px solid var(--checkin-color); outline-offset: 1px; }
    .checkin-year-dot.is-future { opacity: 0.42; }
    .checkin-year-dot.is-empty { visibility: hidden; }

    @media (max-width: 430px) {
      .checkin-page { gap: 12px; }
      .checkin-card { padding: 8px 0; }
      .checkin-days { gap: 5px; }
      .checkin-period button { padding: 0 9px; }
      .checkin-year-grid { gap: 4px; }
    }

    @media (max-width: 430px) {
      .record-card {
        grid-template-columns: 1fr;
      }

      .record-side {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto;
        align-items: center;
        justify-items: stretch;
        min-width: 0;
      }

      .record-side .amount {
        max-width: none;
        text-align: left;
      }

      .mini-actions {
        justify-content: flex-end;
      }

      .checkin-period-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .checkin-range {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) 30px;
        gap: 4px;
        min-width: 0;
        width: 100%;
      }

      .checkin-range-label {
        min-width: 0;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
      }

      .picker-layer.is-year-picker {
        align-items: center;
        overflow-y: auto;
      }

      .picker-layer.is-year-picker .picker-sheet {
        max-height: calc(100vh - var(--safe-top) - var(--safe-bottom) - 32px);
        max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 32px);
        overflow-y: auto;
      }
    }

    #viewEntry > .entry-toggle {
      display: none !important;
    }

    /* Use the check-in segmented-control style across the three modules. */
    .period-mode,
    .weight-page-panel .weight-period-mode,
    .weight-page-panel .weight-person-tabs {
      gap: 3px;
      padding: 3px;
      border: 0;
      border-radius: 999px;
      background: #e8edf5;
      box-shadow: none;
    }

    .period-mode .mode-btn,
    .weight-page-panel .weight-period-mode .mode-btn,
    .weight-page-panel .weight-person-tabs .mode-btn {
      min-height: 32px;
      border-radius: 999px;
      background: transparent;
      color: #697386;
      font-size: 13px;
      font-weight: 700;
    }

    .period-mode .mode-btn.active,
    .weight-page-panel .weight-period-mode .mode-btn.active,
    .weight-page-panel .weight-person-tabs .mode-btn.active {
      background: #ffffff !important;
      color: #009bff !important;
      box-shadow: 0 3px 8px rgba(31, 63, 113, 0.1) !important;
    }

    #viewOverview .period-mode,
    #viewEntry .period-mode {
      background: #f4f9ff;
    }

    /* Keep iOS Safari from zooming the page when a form control receives focus. */
    input,
    textarea,
    select,
    .picker-trigger {
      font-size: 16px !important;
    }

  </style>

    function toDateInput(date) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function currentYear() {
      return new Date().getFullYear();
    }

    function currentMonth() {
      return new Date().getMonth() + 1;
    }

    function maxVisibleMonth(year) {
      return year >= currentYear() ? currentMonth() : 12;
    }

    function clampVisibleYear(year) {
      return Math.min(currentYear(), Math.max(MIN_YEAR, year));
    }

    const amountFormatter = new Intl.NumberFormat("zh-CN", {
      useGrouping: true,
      maximumFractionDigits: 2
    });

    const detailAmountFormatter = new Intl.NumberFormat("zh-CN", {
      useGrouping: true,
      maximumFractionDigits: 0
    });

    function money(value) {
      return amountFormatter.format(value || 0);
    }

    function moneyInDetail(value) {
      return detailAmountFormatter.format(Math.trunc(value || 0));
    }

    const recordAmountFormatter = new Intl.NumberFormat("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    function moneyInRecord(value) {
      return recordAmountFormatter.format(value || 0);
    }

    function signedMoney(value) {
      const number = Number(value) || 0;
      return `${number > 0 ? "+" : ""}${money(number)}`;
    }

    function percent(value) {
      if (!Number.isFinite(value)) return "0%";
      return `${value.toFixed(value >= 10 ? 1 : 2)}%`;
    }

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, match => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[match]));
    }

    function parseNumber(value) {
      const normalized = String(value || "").replace(/,/g, "").replace("，", "").trim();
      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function roundMoney(value) {
      return Math.round((Number(value) || 0) * 100) / 100;
    }

    function uniqueList(list, fallback = []) {
      const result = [];
      [...fallback, ...(Array.isArray(list) ? list : [])].forEach(item => {
        const value = String(item || "").trim();
        if (value && !result.includes(value)) result.push(value);
      });
      return result;
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        incomeOwners,
        incomeCategories: categories.income,
        savedPlaces: categories.saved
      }));
    }

    function loadSettings() {
      try {
        const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        incomeOwners = uniqueList(settings.incomeOwners, defaultIncomeOwners);
        categories = {
